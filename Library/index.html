<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlazeWingz — Library</title>

<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASE
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#000;
  color:white;
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
}

/* =========================================================
   NAVBAR
========================================================= */

.bw-nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 26px;

  background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
}

.bw-brand{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  color:white;
}

.bw-brand img{
  width:42px;
  height:42px;
  border-radius:6px;
  object-fit:cover;
}

.bw-brand span{
  font-size:16px;
  font-weight:600;
}

.bw-nav-links{
  display:flex;
  align-items:center;
  gap:24px;
}

.bw-nav-links a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  opacity:0.9;
  transition:0.2s;
}

.bw-nav-links a:hover{
  opacity:1;
}

/* =========================================================
   HERO
========================================================= */

.bw-hero{
  position:relative;
  width:100%;
  height:420px;
  overflow:hidden;
}

.bw-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.55)),
    linear-gradient(to top, #000 0%, transparent 30%);
}

.bw-hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.bw-hero-content{
  position:absolute;
  inset:0;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;
}

.bw-hero-logo{
  width:min(560px, 70vw);
  opacity:0.95;
  filter:
    drop-shadow(0 0 10px rgba(255,120,255,0.45))
    drop-shadow(0 0 30px rgba(255,120,255,0.25));
}

/* =========================================================
   MAIN
========================================================= */

.bw-main{
  width:min(1700px, calc(100% - 60px));
  margin:auto;
  padding-bottom:120px;
}

.bw-section{
  margin-top:42px;
}

.bw-title{
  font-family:'PT Serif', serif;
  font-size:28px;
  text-align:center;
  margin-bottom:26px;
}

.bw-divider{
  width:100%;
  height:1px;
  background:rgba(255,255,255,0.16);
  margin-bottom:28px;
}

/* =========================================================
   FEATURED
========================================================= */

.bw-featured-card{
  display:block;
  position:relative;
  overflow:hidden;
  border-radius:16px;
  text-decoration:none;
  margin-bottom:26px;
}

.bw-featured-card img{
  width:100%;
  height:240px;
  object-fit:cover;
  transition:transform 0.5s ease;
}

.bw-featured-card:hover img{
  transform:scale(1.04);
}

.bw-featured-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:22px;

  background:
    linear-gradient(to top,
    rgba(0,0,0,0.72),
    rgba(0,0,0,0.12),
    transparent);
}

.bw-featured-label{
  font-size:12px;
  opacity:0.7;
  margin-bottom:5px;
}

.bw-featured-title{
  font-family:'PT Serif', serif;
  font-size:32px;
  color:white;
}

/* =========================================================
   TOP CONTROLS
========================================================= */

.bw-top{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-bottom:34px;

  padding-top:4px;
}

.bw-controls-wrap{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* resting ABOVE search */
.bw-floating-ui{
  position:absolute;
  bottom:100%;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  gap:8px;

  pointer-events:none;

  opacity:0;
  transform:translateY(10px);

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;
}

/* SHOW WHEN SEARCH ACTIVE */
.bw-top.active .bw-floating-ui{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.bw-search-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.bw-search-wrap{
  position:relative;
}

.bw-search{
  width:300px;
  height:42px;

  background:rgba(12,12,12,0.95);
  border:1px solid rgba(255,255,255,0.14);

  border-radius:10px;

  color:white;
  outline:none;

  padding:0 42px 0 14px;

  transition:
    border-color 0.2s,
    background 0.2s,
    width 0.3s ease;
}

.bw-search:focus{
  border-color:rgba(255,255,255,0.35);
  background:rgba(18,18,18,1);
}

.bw-search::placeholder{
  color:rgba(255,255,255,0.5);
}

.bw-search-icon{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  opacity:0.55;
}

.bw-filter-btn,
.bw-indicator{
  height:42px;

  background:rgba(12,12,12,0.95);
  border:1px solid rgba(255,255,255,0.14);

  border-radius:10px;
}

.bw-filter-btn{
  width:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  position:relative;

  transition:0.2s;
}

.bw-filter-btn:hover{
  border-color:rgba(255,255,255,0.35);
}

.bw-indicator{
  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 14px;

  color:white;
  font-size:12px;
  white-space:nowrap;
}

/* =========================================================
   DROPDOWN
========================================================= */

.bw-dropdown{
  position:absolute;
  top:52px;
  right:0;

  display:none;
  flex-direction:column;
  gap:4px;

  width:190px;

  padding:8px;

  border-radius:12px;

  background:rgba(16,16,16,0.95);
  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.12);
}

.bw-dropdown button{
  background:none;
  border:none;
  color:white;

  padding:10px 12px;

  border-radius:8px;

  text-align:left;
  cursor:pointer;

  transition:0.18s;
}

.bw-dropdown button:hover{
  background:rgba(255,255,255,0.07);
}

.bw-dropdown button.active{
  background:white;
  color:black;
}

.bw-separator{
  height:1px;
  background:rgba(255,255,255,0.1);
  margin:4px 0;
}

/* =========================================================
   TAGS
========================================================= */

.bw-tags{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:14px;
}

.bw-tag{
  background:white;
  color:black;

  padding:6px 10px;

  border-radius:8px;

  font-size:12px;
  cursor:pointer;
}

/* =========================================================
   GRID
========================================================= */

.bw-grid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0,1fr));
  gap:18px;

  transition:height 0.35s ease;
}

/* Smooth appearance */
.bw-card{
  position:relative;
  overflow:hidden;

  border-radius:14px;

  background:#111;

  aspect-ratio:1/1;

  text-decoration:none;

  transform:scale(0.97);
  opacity:0;

  transition:
    transform 0.35s cubic-bezier(0.2,0.8,0.2,1),
    opacity 0.35s ease;
}

.bw-card.show{
  opacity:1;
  transform:scale(1);
}

.bw-card.hide{
  opacity:0;
  transform:scale(0.94);
  pointer-events:none;
}

.bw-card img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:transform 0.45s ease;
}

.bw-card:hover img{
  transform:scale(1.06);
}

.bw-card::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(to top,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.15),
    transparent);

  opacity:0;
  transition:0.25s;
}

.bw-card:hover::after{
  opacity:1;
}

.bw-overlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:flex-end;

  padding:14px;

  z-index:2;
}

.bw-name{
  font-family:'PT Serif', serif;
  font-size:20px;
  font-weight:700;
  color:white;

  transform:translateY(180%);
  transition:transform 0.35s cubic-bezier(0.2,0.8,0.2,1);

  text-shadow:
    0 2px 6px rgba(0,0,0,0.9),
    0 6px 18px rgba(0,0,0,0.8),
    0 0 6px rgba(255,255,255,0.15);

  -webkit-text-stroke:0.5px black;
}

.bw-card:hover .bw-name{
  transform:translateY(0);
}

/* RANDOM */
#bw-random-card .bw-name{
  transform:translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:1400px){
  .bw-grid{
    grid-template-columns:repeat(4, minmax(0,1fr));
  }
}

@media (max-width:1100px){
  .bw-grid{
    grid-template-columns:repeat(3, minmax(0,1fr));
  }
}

@media (max-width:800px){

  .bw-hero{
    height:340px;
  }

  .bw-grid{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .bw-search{
    width:240px;
  }
}

@media (max-width:560px){

  .bw-main{
    width:calc(100% - 24px);
  }

  .bw-grid{
    grid-template-columns:1fr;
  }

  .bw-search{
    width:180px;
  }
}

</style>
</head>
<body>

<!-- =========================================================
     NAV
========================================================= -->

<nav class="bw-nav">

  <a class="bw-brand" href="#">
    <img src="https://pbs.twimg.com/profile_images/1872478198927579136/1n8a8F4D_400x400.jpg">
    <span>blazewingz</span>
  </a>

  <div class="bw-nav-links">
    <a href="#">Home</a>
    <a href="#">Library</a>
  </div>

</nav>

<!-- =========================================================
     HERO
========================================================= -->

<section class="bw-hero">

  <img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Homepage/Skyline.jpg?raw=true">

  <div class="bw-hero-content">
    <img class="bw-hero-logo"
    src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Homepage/GAMES.png?raw=true">
  </div>

</section>

<!-- =========================================================
     MAIN
========================================================= -->

<main class="bw-main">

  <!-- FEATURED -->

  <section class="bw-section">

    <div class="bw-title">Fan-Favourites</div>
    <div class="bw-divider"></div>

    <div id="bw-featured"></div>

  </section>

  <!-- LIBRARY -->

  <section class="bw-section">

    <div class="bw-title">Library</div>
    <div class="bw-divider"></div>

    <!-- TOP -->

    <div class="bw-top" id="bw-top">

      <div class="bw-controls-wrap">

        <!-- FLOATING BUTTONS -->
        <div class="bw-floating-ui">

          <div class="bw-filter-btn" id="bw-filter-btn">

            <svg width="18" height="18" fill="white">
              <rect y="3" width="18" height="2"/>
              <rect y="8" width="14" height="2"/>
              <rect y="13" width="10" height="2"/>
            </svg>

            <div class="bw-dropdown" id="bw-dropdown">

              <button data-sort="az">A–Z</button>
              <button data-sort="za">Z–A</button>

              <div class="bw-separator"></div>

              <button data-filter="multiplayer">Multiplayer</button>
              <button data-filter="featured">Featured</button>

            </div>

          </div>

          <div class="bw-indicator" id="bw-indicator">
            A–Z
          </div>

        </div>

        <!-- SEARCH -->
        <div class="bw-search-row">

          <div class="bw-search-wrap">

            <input
              class="bw-search"
              id="bw-search"
              placeholder="Search Library..."
            >

            <svg class="bw-search-icon" viewBox="0 0 24 24" fill="white">
              <path d="M10 2a8 8 0 105.29 14.29l4.71 4.7 1.41-1.41-4.7-4.71A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
            </svg>

          </div>

        </div>

      </div>

      <div class="bw-tags" id="bw-tags"></div>

    </div>

    <!-- GRID -->

    <div class="bw-grid" id="bw-grid">

      <!-- RANDOM -->
      <a href="#" class="bw-card show" id="bw-random-card">
        <img id="bw-random-img">
        <div class="bw-overlay">
          <div class="bw-name">Random Game</div>
        </div>
      </a>

    </div>

  </section>

</main>

<script>

/* =========================================================
   FEATURED
========================================================= */

const featuredGames = [

  {
    name:"Minecraft - Multiplayer",
    link:"#",
    img:"https://static0.gamerantimages.com/wordpress/wp-content/uploads/2022/08/minecraft-4.jpg?w=1600&h=900&fit=crop"
  },

  {
    name:"Brotato",
    link:"#",
    img:"https://wallpapercave.com/wp/wp13551118.png"
  },

  {
    name:"GTA: Vice City",
    link:"#",
    img:"https://c4.wallpaperflare.com/wallpaper/500/833/264/car-gamer-grand-theft-auto-grand-theft-auto-vice-city-wallpaper-preview.jpg"
  }

];

const featured =
featuredGames[Math.floor(Math.random()*featuredGames.length)];

document.getElementById("bw-featured").innerHTML = `
<a href="${featured.link}" class="bw-featured-card">

  <img src="${featured.img}">

  <div class="bw-featured-overlay">
    <div class="bw-featured-label">Featured</div>
    <div class="bw-featured-title">${featured.name}</div>
  </div>

</a>
`;

/* =========================================================
   GAMES
========================================================= */

const games = [

["Undertale","https://image.api.playstation.com/gs2-sec/appkgo/prod/CUSA09239_00/1/i_691ab24757a01bfc94c6f293abd4fac52478bdac0d5829388ceb9a4e4da9c7d1/i/icon0.png"],

["10 Minutes 'Till Dawn","https://github.com/blazewingz/Assets/blob/blazewingz/Assets/10%20Minutes/10%20Minutes%20'Till%20Dawn%20Logo.png?raw=true"],

["Balatro","https://i.scdn.co/image/ab67616d0000b273b153ba98e093ff8841fc5d73"],

["Brotato","https://www.nintendo.com/eu/media/images/11_square_images/games_18/nintendo_switch_download_software/1x1_NSwitchDS_Brotato_image500w.jpg"],

["Buckshot Roulette","https://bleedingcool.com/wp-content/uploads/2024/10/Buckshot-Roulette-Main-Art-900x900.jpg"],

["Celeste","https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Celeste/Celeste.png?raw=true"],

["Cheese Rolling","https://assets-prd.ignimgs.com/2026/01/01/untitled-1-1767290877734.png"],

["Crazy Cattle 3D","https://curverush.com/data/image/crazy-cattle-3d.png"],

["Doom","https://oramind.com/content/images/2020/08/doom-560.jpg"],

["Five Nights at Freddy's","https://cdn2.steamgriddb.com/icon/6aab1270668d8cac7cef2566a1c5f569.png"],

["Minecraft","https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Minecraft/Minecraft%20Logo.png?raw=true"],

["GTA: Vice City","https://github.com/blazewingz/Assets/blob/blazewingz/Assets/GTA:%20Vice%20City/GTA-Vice-City.png?raw=true"],

["YOMI Hustle","https://github.com/blazewingz/Assets/blob/blazewingz/Assets/YOMI%20Hustle/YOMI-Hustle.png?raw=true"]

];

const grid = document.getElementById("bw-grid");

games.forEach(game=>{

  const card = document.createElement("a");

  card.className = "bw-card show";
  card.href = "#";

  card.dataset.name = game[0].toLowerCase();
  card.dataset.real = game[0];

  card.innerHTML = `
    <img src="${game[1]}">

    <div class="bw-overlay">
      <div class="bw-name">${game[0]}</div>
    </div>
  `;

  grid.appendChild(card);

});

/* =========================================================
   SEARCH + FILTERS
========================================================= */

const topEl = document.getElementById("bw-top");
const searchInput = document.getElementById("bw-search");

const dropdown = document.getElementById("bw-dropdown");
const filterBtn = document.getElementById("bw-filter-btn");

const indicator = document.getElementById("bw-indicator");
const tagsEl = document.getElementById("bw-tags");

let sortMode = "az";
let filters = [];

const multiplayer = [
  "Minecraft",
  "YOMI Hustle",
  "Cheese Rolling"
];

const featuredList = [
  "Balatro",
  "Brotato",
  "Minecraft",
  "GTA: Vice City",
  "YOMI Hustle"
];

/* FLOATING UI APPEAR */
searchInput.addEventListener("focus", ()=>{
  topEl.classList.add("active");
});

searchInput.addEventListener("blur", ()=>{

  if(searchInput.value.trim() === ""){
    topEl.classList.remove("active");
  }

});

/* DROPDOWN */
filterBtn.onclick = e => {

  e.stopPropagation();

  dropdown.style.display =
  dropdown.style.display === "flex"
  ? "none"
  : "flex";

};

document.addEventListener("click", ()=>{
  dropdown.style.display = "none";
});

/* BUTTONS */
dropdown.querySelectorAll("button").forEach(btn=>{

  btn.onclick = ()=>{

    const sort = btn.dataset.sort;
    const filter = btn.dataset.filter;

    if(sort){
      sortMode = sort;
    }

    if(filter){

      if(filters.includes(filter)){
        filters = filters.filter(x=>x!==filter);
      }else{
        filters.push(filter);
      }

    }

    updateUI();
    render();

  };

});

function updateUI(){

  dropdown.querySelectorAll("[data-sort]").forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.sort === sortMode
    );

  });

  tagsEl.innerHTML = "";

  filters.forEach(filter=>{

    const tag = document.createElement("div");

    tag.className = "bw-tag";
    tag.textContent = filter + " ✕";

    tag.onclick = ()=>{

      filters = filters.filter(x=>x!==filter);

      updateUI();
      render();

    };

    tagsEl.appendChild(tag);

  });

  let text =
  sortMode === "az"
  ? "A–Z"
  : "Z–A";

  if(filters.length){
    text += " • " + filters.join(", ");
  }

  indicator.textContent = text;

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const cards = [
    ...document.querySelectorAll(".bw-card")
  ].filter(card=>card.id !== "bw-random-card");

  let visible = [];

  cards.forEach(card=>{

    const name = card.dataset.real;
    const lower = card.dataset.name;

    let show = true;

    /* SEARCH */
    if(
      searchInput.value &&
      !lower.includes(searchInput.value.toLowerCase())
    ){
      show = false;
    }

    /* FILTERS */
    filters.forEach(filter=>{

      if(
        filter === "multiplayer" &&
        !multiplayer.includes(name)
      ){
        show = false;
      }

      if(
        filter === "featured" &&
        !featuredList.includes(name)
      ){
        show = false;
      }

    });

    if(show){
      visible.push(card);
    }

  });

  /* SORT */
  visible.sort((a,b)=>{

    const aName = a.dataset.real;
    const bName = b.dataset.real;

    return sortMode === "az"
    ? aName.localeCompare(bName)
    : bName.localeCompare(aName);

  });

  /* smooth appearance */
  cards.forEach(card=>{

    if(visible.includes(card)){

      card.classList.remove("hide");

      requestAnimationFrame(()=>{
        card.classList.add("show");
      });

    }else{

      card.classList.remove("show");
      card.classList.add("hide");

    }

  });

  /* reorder without layout snapping */
  setTimeout(()=>{

    visible.forEach(card=>{
      grid.appendChild(card);
    });

  },120);

}

searchInput.addEventListener("input", ()=>{

  topEl.classList.add("active");
  render();

});

/* =========================================================
   RANDOM CARD
========================================================= */

const randomCard = document.getElementById("bw-random-card");
const randomImg = document.getElementById("bw-random-img");

function pickRandom(){

  const cards = [
    ...document.querySelectorAll(".bw-card")
  ].filter(card=>card.id !== "bw-random-card");

  return cards[
    Math.floor(Math.random()*cards.length)
  ];

}

function updateRandom(){

  const pick = pickRandom();

  randomImg.style.opacity = 0;

  setTimeout(()=>{

    randomImg.src =
    pick.querySelector("img").src;

    randomImg.style.opacity = 1;

  },180);

}

setInterval(updateRandom, 5000);
updateRandom();

randomCard.onclick = e => {

  e.preventDefault();

  const pick = pickRandom();

  window.open(pick.href, "_blank");

};

updateUI();

</script>

</body>
</html>
