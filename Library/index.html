<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlazeWingz — Library</title>

<link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

/* =========================
   HERO
========================= */

.bw-hero{
  position:relative;
  width:100%;
  min-height:92vh;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.55),
      rgba(0,0,0,0.92)
    ),
    url('https://github.com/blazewingz/blazewingz/blob/ee82226ae283e2dc18cf646e0a44f7ccaf82e82c/Home/Assets/Wallpaper.jpg?raw=true');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.bw-hero::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at center,
      rgba(160,90,255,0.16),
      transparent 60%);

  pointer-events:none;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glowPulse{
  0%{
    text-shadow:
      0 0 10px rgba(200,100,255,0.8),
      0 0 30px rgba(180,80,255,0.4),
      0 0 45px rgba(150,60,255,0.25);
  }

  50%{
    text-shadow:
      0 0 20px rgba(220,140,255,1),
      0 0 40px rgba(200,100,255,0.6),
      0 0 60px rgba(180,80,255,0.4);
  }

  100%{
    text-shadow:
      0 0 10px rgba(200,100,255,0.8),
      0 0 30px rgba(180,80,255,0.4),
      0 0 45px rgba(150,60,255,0.25);
  }
}

.bw-title{
  position:relative;
  z-index:2;

  font-family:'Space Age',sans-serif;
  font-size:clamp(60px,10vw,140px);

  letter-spacing:10px;
  text-transform:uppercase;

  animation:
    fadeIn 2s ease forwards,
    glowPulse 6s ease-in-out infinite;
}

.bw-sub{
  margin-top:16px;
  opacity:0.7;
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:12px;
}

/* =========================
   MAIN
========================= */

.bw-main{
  position:relative;
  z-index:2;

  max-width:1700px;
  margin:auto;

  padding:
    40px
    28px
    100px;
}

/* =========================
   SECTION TITLES
========================= */

.bw-section-title{
  font-family:'PT Serif',serif;
  font-size:32px;
  margin-bottom:18px;
}

/* =========================
   FEATURED GRID
========================= */

.bw-featured-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:34px;
}

@media(max-width:1100px){

  .bw-featured-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  .bw-featured-grid{
    grid-template-columns:1fr;
  }

}

.bw-card{
  position:relative;
  overflow:hidden;

  border-radius:14px;

  background:#111;

  text-decoration:none;

  aspect-ratio:1/1;

  transition:
    transform .22s ease,
    opacity .22s ease;
}

.bw-card:hover{
  transform:scale(1.02);
}

.bw-card::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:40%;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.82),
      rgba(0,0,0,0)
    );

  z-index:1;
}

.bw-card img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:transform .45s ease;
}

.bw-card:hover img{
  transform:scale(1.07);
}

.bw-overlay{
  position:absolute;
  inset:0;

  z-index:2;

  display:flex;
  align-items:flex-end;

  padding:18px;
}

.bw-name{
  font-family:'PT Serif',serif;
  font-size:22px;
  font-weight:700;

  color:white;

  transform:translateY(180%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);

  text-shadow:
    0 2px 6px rgba(0,0,0,0.9),
    0 6px 18px rgba(0,0,0,0.8),
    0 0 6px rgba(255,255,255,0.15);

  -webkit-text-stroke:0.6px black;
}

.bw-card:hover .bw-name{
  transform:translateY(0);
}

/* =========================
   FEATURED BANNER
========================= */

.bw-featured-banner{
  position:relative;

  display:block;

  overflow:hidden;

  border-radius:18px;

  margin-bottom:38px;

  text-decoration:none;
}

.bw-featured-banner img{
  width:100%;
  height:320px;
  object-fit:cover;

  transition:transform .45s ease;
}

.bw-featured-banner:hover img{
  transform:scale(1.04);
}

.bw-featured-banner::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.92),
      rgba(0,0,0,.15)
    );
}

.bw-featured-content{
  position:absolute;
  left:24px;
  bottom:24px;

  z-index:2;
}

.bw-featured-label{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  opacity:0.75;
  margin-bottom:8px;
}

.bw-featured-title{
  font-family:'PT Serif',serif;
  font-size:40px;
}

/* =========================
   STICKY CONTROLS
========================= */

.bw-controls-wrap{
  position:sticky;
  top:0;

  z-index:999;

  padding:
    14px
    0;

  margin-bottom:28px;

  backdrop-filter:blur(14px);

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.92),
      rgba(0,0,0,.72)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.08);
}

.bw-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.bw-search-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.bw-search-wrap{
  position:relative;
}

.bw-search{
  width:320px;

  padding:
    11px
    38px
    11px
    14px;

  border-radius:10px;

  background:#111;

  border:
    1px solid
    rgba(255,255,255,.12);

  color:white;

  outline:none;
}

.bw-search:focus{
  border-color:rgba(180,100,255,.8);
  box-shadow:
    0 0 0 4px
    rgba(160,90,255,.12);
}

.bw-search-icon{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  width:16px;
  height:16px;

  opacity:0.6;
}

.bw-filter-btn{
  width:42px;
  height:42px;

  border-radius:10px;

  background:#111;

  border:
    1px solid
    rgba(255,255,255,.12);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  position:relative;
}

.bw-indicator{
  height:42px;

  display:flex;
  align-items:center;

  padding:0 14px;

  border-radius:10px;

  background:#111;

  border:
    1px solid
    rgba(255,255,255,.12);

  font-size:13px;
}

.bw-dropdown{
  position:absolute;

  top:50px;
  right:0;

  min-width:190px;

  border-radius:12px;

  padding:8px;

  background:
    rgba(16,16,16,.96);

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:blur(10px);

  display:none;
  flex-direction:column;
  gap:4px;
}

.bw-dropdown button{
  border:none;
  background:none;

  color:white;

  padding:10px;

  text-align:left;

  border-radius:8px;

  cursor:pointer;
}

.bw-dropdown button:hover{
  background:rgba(255,255,255,.08);
}

.bw-dropdown button.active{
  background:white;
  color:black;
}

.bw-separator{
  height:1px;
  background:rgba(255,255,255,.1);
  margin:4px 0;
}

.bw-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.bw-tag{
  background:white;
  color:black;

  padding:
    6px
    10px;

  border-radius:999px;

  font-size:12px;

  cursor:pointer;
}

/* =========================
   LIBRARY GRID
========================= */

.bw-library-grid{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:18px;
}

@media(max-width:1500px){

  .bw-library-grid{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:1100px){

  .bw-library-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:780px){

  .bw-library-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:560px){

  .bw-library-grid{
    grid-template-columns:1fr;
  }

}

#bw-random-card .bw-name{
  transform:translateY(0);
}

</style>
</head>

<body>

<!-- HERO -->

<section class="bw-hero">

  <div>

    <div class="bw-title">
      GAMES
    </div>

    <div class="bw-sub">
      Impossible Ports. Play Anywhere.
    </div>

  </div>

</section>

<!-- MAIN -->

<div class="bw-main">

  <!-- FAN FAVOURITES -->

  <div class="bw-section-title">
    Fan Favourites
  </div>

  <div class="bw-featured-grid">

    <a href="https://sites.google.com/view/blazewingz/games/brotato" target="_blank" class="bw-card">
      <img src="https://www.nintendo.com/eu/media/images/11_square_images/games_18/nintendo_switch_download_software/1x1_NSwitchDS_Brotato_image500w.jpg">
      <div class="bw-overlay"><div class="bw-name">Brotato</div></div>
    </a>

    <a href="https://sites.google.com/view/blazewingz/games/gta-vice-city" target="_blank" class="bw-card">
      <img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/GTA:%20Vice%20City/GTA-Vice-City.png?raw=true">
      <div class="bw-overlay"><div class="bw-name">GTA: Vice City</div></div>
    </a>

    <a href="https://sites.google.com/view/blazewingz/games/minecraft" target="_blank" class="bw-card">
      <img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Minecraft/Minecraft%20Logo.png?raw=true">
      <div class="bw-overlay"><div class="bw-name">Minecraft</div></div>
    </a>

    <a href="https://sites.google.com/view/blazewingz/games/yomi-hustle" target="_blank" class="bw-card">
      <img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/YOMI%20Hustle/YOMI-Hustle.png?raw=true">
      <div class="bw-overlay"><div class="bw-name">YOMI Hustle</div></div>
    </a>

  </div>

  <!-- FEATURED -->

  <a id="bw-featured-banner" target="_blank" class="bw-featured-banner">

    <img id="bw-featured-img">

    <div class="bw-featured-content">

      <div class="bw-featured-label">
        Featured
      </div>

      <div class="bw-featured-title" id="bw-featured-title">
      </div>

    </div>

  </a>

  <!-- CONTROLS -->

  <div class="bw-controls-wrap">

    <div class="bw-top">

      <div class="bw-search-row">

        <div class="bw-search-wrap">

          <input
            id="bw-search"
            class="bw-search"
            placeholder="Search Library..."
          >

          <svg class="bw-search-icon" viewBox="0 0 24 24" fill="white">
            <path d="M10 2a8 8 0 105.29 14.29l4.71 4.7 1.41-1.41-4.7-4.71A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
          </svg>

        </div>

        <div class="bw-filter-btn" id="bw-filter-btn">

          <svg width="18" height="18" fill="white">
            <rect y="3" width="18" height="2"/>
            <rect y="8" width="14" height="2"/>
            <rect y="13" width="10" height="2"/>
          </svg>

          <div class="bw-dropdown" id="bw-dropdown">

            <button data-sort="az">
              A–Z
            </button>

            <button data-sort="za">
              Z–A
            </button>

            <div class="bw-separator"></div>

            <button data-filter="multiplayer">
              Multiplayer
            </button>

            <button data-filter="featured">
              Featured
            </button>

          </div>

        </div>

        <div class="bw-indicator" id="bw-indicator">
          A–Z
        </div>

      </div>

      <div class="bw-tags" id="bw-tags"></div>

    </div>

  </div>

  <!-- LIBRARY -->

  <div class="bw-library-grid" id="bw-grid">

    <!-- RANDOM -->

    <a href="#" class="bw-card" id="bw-random-card">

      <img id="bw-random-img">

      <div class="bw-overlay">
        <div class="bw-name">
          Random Game
        </div>
      </div>

    </a>

  </div>

</div>

<script>

/* =========================
   GAMES
========================= */

const games = [

{
  name:"10 Minutes 'Till Dawn",
  link:"https://sites.google.com/view/blazewingz/games/10-minutes-till-dawn",
  img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/10%20Minutes/10%20Minutes%20'Till%20Dawn%20Logo.png?raw=true"
},

{
  name:"Balatro",
  link:"https://sites.google.com/view/blazewingz/games/balatro",
  img:"https://i.scdn.co/image/ab67616d0000b273b153ba98e093ff8841fc5d73"
},

{
  name:"Brotato",
  link:"https://sites.google.com/view/blazewingz/games/brotato",
  img:"https://www.nintendo.com/eu/media/images/11_square_images/games_18/nintendo_switch_download_software/1x1_NSwitchDS_Brotato_image500w.jpg"
},

{
  name:"Buckshot Roulette",
  link:"https://sites.google.com/view/blazewingz/games/buckshot-roulette",
  img:"https://bleedingcool.com/wp-content/uploads/2024/10/Buckshot-Roulette-Main-Art-900x900.jpg"
},

{
  name:"Celeste",
  link:"https://sites.google.com/view/blazewingz/games/celeste",
  img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Celeste/Celeste.png?raw=true"
},

{
  name:"Doom",
  link:"https://sites.google.com/view/blazewingz/games/doom",
  img:"https://oramind.com/content/images/2020/08/doom-560.jpg"
},

{
  name:"Half-Life",
  link:"https://sites.google.com/view/blazewingz/games/half-life",
  img:"https://cdn.wikimg.net/en/strategywiki/images/thumb/b/ba/Half-Life_Boxart.jpg/250px-Half-Life_Boxart.jpg"
},

{
  name:"Minecraft",
  link:"https://sites.google.com/view/blazewingz/games/minecraft",
  img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Minecraft/Minecraft%20Logo.png?raw=true"
},

{
  name:"Terraria",
  link:"https://sites.google.com/view/blazewingz/games/terraria",
  img:"https://forums.terraria.org/index.php?attachments/icon-png.280655/"
},

{
  name:"YOMI Hustle",
  link:"https://sites.google.com/view/blazewingz/games/yomi-hustle",
  img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/YOMI%20Hustle/YOMI-Hustle.png?raw=true"
},

{
  name:"Ultrakill",
  link:"https://sites.google.com/view/blazewingz/games/ultrakill",
  img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Ultrakill/Ultrakill.png?raw=true"
},

{
  name:"Undertale",
  link:"https://sites.google.com/view/blazewingz/games/undertale",
  img:"https://image.api.playstation.com/gs2-sec/appkgo/prod/CUSA09239_00/1/i_691ab24757a01bfc94c6f293abd4fac52478bdac0d5829388ceb9a4e4da9c7d1/i/icon0.png"
}

];

/* =========================
   FEATURED ROTATION
========================= */

const featuredGames = [

{
  name:"Minecraft",
  link:"https://sites.google.com/view/blazewingz/games/minecraft",
  img:"https://static0.gamerantimages.com/wordpress/wp-content/uploads/2022/08/minecraft-4.jpg?w=1600&h=900&fit=crop"
},

{
  name:"Brotato",
  link:"https://sites.google.com/view/blazewingz/games/brotato",
  img:"https://wallpapercave.com/wp/wp13551118.png"
},

{
  name:"GTA: Vice City",
  link:"https://sites.google.com/view/blazewingz/games/gta-vice-city",
  img:"https://c4.wallpaperflare.com/wallpaper/500/833/264/car-gamer-grand-theft-auto-grand-theft-auto-vice-city-wallpaper-preview.jpg"
},

{
  name:"YOMI Hustle",
  link:"https://sites.google.com/view/blazewingz/games/yomi-hustle",
  img:"https://images.steamusercontent.com/ugc/2038477893869161638/BB643F4DC6895EF1DBCA8AC1D613C5E3B7A55475/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true"
}

];

const featuredBanner = document.getElementById("bw-featured-banner");
const featuredImg = document.getElementById("bw-featured-img");
const featuredTitle = document.getElementById("bw-featured-title");

function updateFeatured(){

  const game =
    featuredGames[
      Math.floor(
        Math.random() * featuredGames.length
      )
    ];

  featuredBanner.href = game.link;
  featuredImg.src = game.img;
  featuredTitle.textContent = game.name;

}

updateFeatured();

setInterval(updateFeatured,7000);

/* =========================
   BUILD LIBRARY
========================= */

const grid = document.getElementById("bw-grid");

games.forEach(game=>{

  const card = document.createElement("a");

  card.href = game.link;
  card.target = "_blank";
  card.className = "bw-card";

  card.innerHTML = `
    <img src="${game.img}">
    <div class="bw-overlay">
      <div class="bw-name">
        ${game.name}
      </div>
    </div>
  `;

  grid.appendChild(card);

});

/* =========================
   CONTROLS
========================= */

const dropdown = document.getElementById("bw-dropdown");
const filterBtn = document.getElementById("bw-filter-btn");
const searchInput = document.getElementById("bw-search");
const tagsEl = document.getElementById("bw-tags");
const indicator = document.getElementById("bw-indicator");

const randomCard = document.getElementById("bw-random-card");
const randomImg = document.getElementById("bw-random-img");

let cards =
  Array.from(
    grid.querySelectorAll(".bw-card")
  ).filter(c=>c!==randomCard);

let filters = [];
let search = "";
let sortMode = "az";

const multiplayer = [
  "Minecraft",
  "YOMI Hustle"
];

const featured = [
  "Balatro",
  "Brotato",
  "Minecraft",
  "Terraria",
  "YOMI Hustle"
];

/* =========================
   DROPDOWN
========================= */

filterBtn.onclick = e => {

  e.stopPropagation();

  dropdown.style.display =
    dropdown.style.display === "flex"
    ? "none"
    : "flex";

};

document.addEventListener(
  "click",
  ()=> dropdown.style.display = "none"
);

/* =========================
   FILTER BUTTONS
========================= */

dropdown.querySelectorAll("button")
.forEach(btn=>{

  btn.onclick = ()=>{

    const s = btn.dataset.sort;
    const f = btn.dataset.filter;

    if(s){
      sortMode = s;
    }

    if(f){

      if(filters.includes(f)){

        filters =
          filters.filter(x=>x!==f);

      }else{

        filters.push(f);

      }

    }

    updateUI();
    render();

  };

});

/* =========================
   UI
========================= */

function updateUI(){

  dropdown
  .querySelectorAll("[data-sort]")
  .forEach(b=>{

    b.classList.toggle(
      "active",
      b.dataset.sort === sortMode
    );

  });

  tagsEl.innerHTML = "";

  filters.forEach(f=>{

    const t = document.createElement("div");

    t.className = "bw-tag";

    t.innerText = f + " ✕";

    t.onclick = ()=>{

      filters =
        filters.filter(x=>x!==f);

      updateUI();
      render();

    };

    tagsEl.appendChild(t);

  });

  let text =
    sortMode === "az"
    ? "A–Z"
    : "Z–A";

  if(filters.length){

    text +=
      " • " +
      filters.join(", ");

  }

  indicator.textContent = text;

}

/* =========================
   SEARCH
========================= */

searchInput.oninput = e => {

  search =
    e.target.value.toLowerCase();

  render();

};

/* =========================
   RENDER
========================= */

function render(){

  let list = [...cards];

  list.sort((a,b)=>{

    const aName =
      a.querySelector(".bw-name")
      .innerText
      .trim();

    const bName =
      b.querySelector(".bw-name")
      .innerText
      .trim();

    return sortMode === "az"
      ? aName.localeCompare(bName)
      : bName.localeCompare(aName);

  });

  cards.forEach(c=>c.remove());

  list.forEach(card=>{

    const cleanName =
      card.querySelector(".bw-name")
      .innerText
      .trim();

    const lowerName =
      cleanName.toLowerCase();

    if(
      search &&
      !lowerName.includes(search)
    ){
      return;
    }

    for(let f of filters){

      if(
        f === "multiplayer" &&
        !multiplayer.includes(cleanName)
      ){
        return;
      }

      if(
        f === "featured" &&
        !featured.includes(cleanName)
      ){
        return;
      }

    }

    grid.appendChild(card);

  });

}

/* =========================
   RANDOM CARD
========================= */

function pick(){

  return games[
    Math.floor(
      Math.random() * games.length
    )
  ];

}

function updateRandom(){

  const game = pick();

  randomImg.style.opacity = 0;

  setTimeout(()=>{

    randomImg.src = game.img;

    randomImg.style.opacity = 1;

    randomCard.href = game.link;

  },200);

}

updateRandom();

setInterval(updateRandom,5000);

/* =========================
   INIT
========================= */

updateUI();
render();

</script>
