<link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap');

:root{
  --bw-gap:18px;
  --bw-radius:16px;
}

/* ========================= */
/* GLOBAL */
/* ========================= */

body{
  margin:0;
  background:
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.82)),
    url('https://github.com/blazewingz/blazewingz/blob/ee82226ae283e2dc18cf646e0a44f7ccaf82e82c/Home/Assets/Wallpaper.jpg?raw=true');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:white;
  overflow-x:hidden;
}

/* ========================= */
/* TITLE */
/* ========================= */

@keyframes fadeIn {
  from {
    opacity:0;
    transform:translateY(12px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glowPulse {
  0%{
    text-shadow:
      0 0 10px rgba(200,100,255,0.8),
      0 0 30px rgba(180,80,255,0.4),
      0 0 45px rgba(150,60,255,0.25);
  }

  50%{
    text-shadow:
      0 0 20px rgba(220,140,255,1),
      0 0 40px rgba(200,100,255,0.6),
      0 0 60px rgba(180,80,255,0.4);
  }

  100%{
    text-shadow:
      0 0 10px rgba(200,100,255,0.8),
      0 0 30px rgba(180,80,255,0.4),
      0 0 45px rgba(150,60,255,0.25);
  }
}

.bw-title-wrap{
  text-align:center;
  padding-top:40px;
  margin-bottom:30px;
}

.bw-title{
  font-family:'Space Age', sans-serif;
  font-size:72px;
  letter-spacing:6px;
  text-transform:uppercase;
  animation:
    fadeIn 2s ease forwards,
    glowPulse 6s ease-in-out infinite;
}

/* ========================= */
/* STICKY TOP BAR */
/* ========================= */

.bw-top-wrap{
  position:sticky;
  top:0;
  z-index:99999;
  padding:14px 0;
  backdrop-filter:blur(14px);
  background:linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.45));
}

.bw-top{
  width:min(1400px, calc(100% - 32px));
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.bw-search-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.bw-search-wrap{
  position:relative;
}

.bw-search{
  width:280px;
  padding:10px 38px 10px 14px;
  border:none;
  border-radius:10px;
  outline:none;
  color:white;
  background:rgba(15,15,15,0.88);
  border:1px solid rgba(255,255,255,0.15);
  font-size:14px;
}

.bw-search::placeholder{
  color:rgba(255,255,255,0.55);
}

.bw-search-icon{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:0.6;
}

.bw-filter-btn{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(15,15,15,0.88);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.bw-indicator{
  height:38px;
  padding:0 12px;
  border-radius:10px;
  background:rgba(15,15,15,0.88);
  border:1px solid rgba(255,255,255,0.15);
  display:flex;
  align-items:center;
  font-size:12px;
  color:white;
  white-space:nowrap;
}

/* ========================= */
/* DROPDOWN */
/* ========================= */

.bw-dropdown{
  position:absolute;
  top:48px;
  right:0;
  width:180px;
  padding:6px;
  border-radius:12px;
  background:rgba(18,18,18,0.96);
  border:1px solid rgba(255,255,255,0.12);
  display:none;
  flex-direction:column;
  gap:4px;
  backdrop-filter:blur(10px);
}

.bw-dropdown button{
  background:none;
  border:none;
  color:white;
  text-align:left;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.bw-dropdown button:hover{
  background:rgba(255,255,255,0.08);
}

.bw-dropdown button.active{
  background:white;
  color:black;
}

.bw-separator{
  height:1px;
  background:rgba(255,255,255,0.12);
  margin:4px 0;
}

/* ========================= */
/* TAGS */
/* ========================= */

.bw-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}

.bw-tag{
  background:white;
  color:black;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* ========================= */
/* FEATURED */
/* ========================= */

.bw-featured-wrap{
  width:min(1400px, calc(100% - 32px));
  margin:24px auto 26px auto;
}

.bw-featured-card{
  position:relative;
  display:block;
  overflow:hidden;
  border-radius:18px;
  text-decoration:none;
}

.bw-featured-card img{
  width:100%;
  height:280px;
  object-fit:cover;
  transition:transform 0.45s ease;
}

.bw-featured-card:hover img{
  transform:scale(1.04);
}

.bw-featured-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:22px;
  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.78),
      rgba(0,0,0,0.12)
    );
}

.bw-featured-label{
  font-size:12px;
  letter-spacing:1px;
  opacity:0.75;
  margin-bottom:4px;
}

.bw-featured-title{
  font-family:'PT Serif', serif;
  font-size:30px;
  font-weight:700;
  color:white;
}

/* ========================= */
/* GRID */
/* ========================= */

.bw-grid{
  width:min(1400px, calc(100% - 32px));
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5, minmax(0,1fr));
  gap:var(--bw-gap);
  padding-bottom:60px;
}

@media (max-width:1500px){
  .bw-grid{
    grid-template-columns:repeat(4, minmax(0,1fr));
  }
}

@media (max-width:1100px){
  .bw-grid{
    grid-template-columns:repeat(3, minmax(0,1fr));
  }
}

@media (max-width:760px){
  .bw-grid{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .bw-title{
    font-size:52px;
  }

  .bw-featured-card img{
    height:220px;
  }
}

@media (max-width:520px){

  .bw-grid{
    grid-template-columns:1fr;
  }

  .bw-search{
    width:190px;
  }

  .bw-title{
    font-size:42px;
  }

}

/* ========================= */
/* CARDS */
/* ========================= */

.bw-card{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#111;
  aspect-ratio:1/1;
  text-decoration:none;
  transition:
    transform 0.22s ease,
    opacity 0.18s ease;
}

.bw-card:hover{
  transform:scale(1.02);
}

.bw-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.4s ease;
}

.bw-card:hover img{
  transform:scale(1.06);
}

.bw-card::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.72),
      rgba(0,0,0,0)
    );
  pointer-events:none;
}

.bw-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:14px;
  z-index:2;
}

.bw-name{
  font-family:'PT Serif', serif;
  font-size:19px;
  font-weight:700;
  color:white;
  transform:translateY(200%);
  transition:transform 0.34s cubic-bezier(0.2,0.8,0.2,1);
  text-shadow:
    0 2px 6px rgba(0,0,0,0.95),
    0 6px 18px rgba(0,0,0,0.85),
    0 0 8px rgba(255,255,255,0.14);
  -webkit-text-stroke:0.5px black;
}

.bw-card:hover .bw-name{
  transform:translateY(0);
}

/* RANDOM CARD */

#bw-random-card .bw-name{
  transform:translateY(0);
}
</style>

<div class="bw-title-wrap">
  <div class="bw-title">
    GAMES
  </div>
</div>

<div class="bw-top-wrap">
  <div class="bw-top">

    <div class="bw-search-row">

      <div class="bw-search-wrap">
        <input
          id="bw-search"
          class="bw-search"
          placeholder="Search Library..."
        >

        <svg class="bw-search-icon" viewBox="0 0 24 24" fill="white">
          <path d="M10 2a8 8 0 105.29 14.29l4.71 4.7 1.41-1.41-4.7-4.71A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
        </svg>
      </div>

      <div class="bw-filter-btn" id="bw-filter-btn">

        <svg width="18" height="18" fill="white">
          <rect y="3" width="18" height="2"/>
          <rect y="8" width="14" height="2"/>
          <rect y="13" width="10" height="2"/>
        </svg>

        <div class="bw-dropdown" id="bw-dropdown">
          <button data-sort="az">A–Z</button>
          <button data-sort="za">Z–A</button>

          <div class="bw-separator"></div>

          <button data-filter="multiplayer">Multiplayer</button>
          <button data-filter="featured">Featured</button>
        </div>

      </div>

      <div class="bw-indicator" id="bw-indicator">
        A–Z
      </div>

    </div>

    <div class="bw-tags" id="bw-tags"></div>

  </div>
</div>

<div class="bw-featured-wrap">
  <div id="bw-featured"></div>
</div>

<div class="bw-grid" id="bw-grid">

  <!-- RANDOM -->
  <a href="#" class="bw-card" id="bw-random-card">
    <img id="bw-random-img">
    <div class="bw-overlay">
      <div class="bw-name">Random Game</div>
    </div>

</div>

},

{

link:"https://sites.google.com/view/blazewingz/games/undertale",
img:"https://image.api.playstation.com/gs2-sec/appkgo/prod/CUSA09239_00/1/i_691ab24757a01bfc94c6f293abd4fac52478bdac0d5829388ceb9a4e4da9c7d1/i/icon0.png"
},

{
name:"GTA: Vice City",
link:"https://sites.google.com/view/blazewingz/games/gta-vice-city",
img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/GTA:%20Vice%20City/GTA-Vice-City.png?raw=true",
featured:true
},

{
name:"YOMI Hustle",
link:"https://sites.google.com/view/blazewingz/games/yomi-hustle",
img:"https://github.com/blazewingz/Assets/blob/blazewingz/Assets/YOMI%20Hustle/YOMI-Hustle.png?raw=true",
multiplayer:true,
featured:true
}

];

/* ========================= */
/* ELEMENTS */
/* ========================= */

const grid = document.getElementById("bw-grid");
const featured = document.getElementById("bw-featured");

const searchInput = document.getElementById("bw-search");
const dropdown = document.getElementById("bw-dropdown");
const filterBtn = document.getElementById("bw-filter-btn");
const tagsEl = document.getElementById("bw-tags");
const indicator = document.getElementById("bw-indicator");

let filters = [];
let search = "";
let sortMode = "az";

/* ========================= */
/* FEATURED */
/* ========================= */

const featuredGames = games.filter(g => g.featured);

function randomFeatured(){

  const game =
    featuredGames[
      Math.floor(Math.random() * featuredGames.length)
    ];

  featured.innerHTML = `
    <a href="${game.link}" target="_blank" class="bw-featured-card">
      <img src="${game.img}">
      <div class="bw-featured-overlay">
        <div class="bw-featured-label">
          Featured
        </div>

        <div class="bw-featured-title">
          ${game.name}
        </div>
      </div>
    </a>
  `;

}

randomFeatured();

/* ========================= */
/* UI */
/* ========================= */

filterBtn.onclick = e => {
  e.stopPropagation();

  dropdown.style.display =
    dropdown.style.display === "flex"
      ? "none"
      : "flex";
};

document.addEventListener("click", ()=>{
  dropdown.style.display = "none";
});

dropdown.querySelectorAll("button").forEach(btn=>{

  btn.onclick = ()=>{

    const sort = btn.dataset.sort;
    const filter = btn.dataset.filter;

    if(sort){
      sortMode = sort;
    }

    if(filter){

      if(filters.includes(filter)){
        filters = filters.filter(x=>x!==filter);
      } else {
        filters.push(filter);
      }

    }

    updateUI();
    render();

  };

});

searchInput.oninput = e => {
  search = e.target.value.toLowerCase();
  render();
};

function updateUI(){

  dropdown.querySelectorAll("[data-sort]")
  .forEach(b=>{

    b.classList.toggle(
      "active",
      b.dataset.sort === sortMode
    );

  });

  tagsEl.innerHTML = "";

  filters.forEach(filter=>{

    const tag = document.createElement("div");

    tag.className = "bw-tag";
    tag.innerText = filter + " ✕";

    tag.onclick = ()=>{

      filters = filters.filter(x=>x!==filter);

      updateUI();
      render();

    };

    tagsEl.appendChild(tag);

  });

  let text =
    sortMode === "az"
      ? "A–Z"
      : "Z–A";

  if(filters.length){
    text += " • " + filters.join(", ");
  }

  indicator.textContent = text;

}

/* ========================= */
/* RANDOM */
/* ========================= */

function pickRandom(){

  return games[
    Math.floor(Math.random() * games.length)
  ];

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(){

  grid.innerHTML = "";

  /* RANDOM CARD */

  const randomGame = pickRandom();

  const randomCard = document.createElement("a");

  randomCard.href = randomGame.link;
  randomCard.target = "_blank";

  randomCard.className = "bw-card";
  randomCard.id = "bw-random-card";

  randomCard.innerHTML = `
    <img src="${randomGame.img}">
    <div class="bw-overlay">
      <div class="bw-name">
        Random Game
      </div>
    </div>
  `;

  grid.appendChild(randomCard);

  /* SORT */

  let list = [...games];

  list.sort((a,b)=>{

    return sortMode === "az"
      ? a.name.localeCompare(b.name)
      : b.name.localeCompare(a.name);

  });

  /* BUILD */

  list.forEach(game=>{

    const lower = game.name.toLowerCase();

    if(search && !lower.includes(search)){
      return;
    }

    if(filters.includes("multiplayer") && !game.multiplayer){
      return;
    }

    if(filters.includes("featured") && !game.featured){
      return;
    }

    const card = document.createElement("a");

    card.href = game.link;
    card.target = "_blank";
    card.className = "bw-card";

    card.innerHTML = `
      <img src="${game.img}">
      <div class="bw-overlay">
        <div class="bw-name">
          ${game.name}
        </div>
      </div>
    `;

    grid.appendChild(card);

  });

}

updateUI();
render();

/* FEATURED ROTATION */

setInterval(randomFeatured, 10000);
</script>
