<style>
@import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap');

:root{
  --bw-accent:#ff00ff;
  --bw-glow:rgba(255,0,255,0.35);
  --bw-bg:#05010a;
}

/* ================= ROOT ================= */

body{
  background:
    radial-gradient(circle at top, rgba(255,0,255,0.12), transparent 45%),
    linear-gradient(to bottom,#09010f,#05010a 45%);
}

/* CURSOR GLOW */

#bw-cursor-glow{
  position:fixed;
  width:180px;
  height:180px;
  border-radius:50%;
  pointer-events:none;
  z-index:2;

  background:
    radial-gradient(
      circle,
      rgba(255,0,255,0.12) 0%,
      rgba(255,0,255,0.06) 35%,
      transparent 75%
    );

  transform:translate(-50%,-50%);
  transition:transform 0.05s linear;
  opacity:0.9;
}

/* ================= HERO ================= */

.bw-hero{
  position:relative;
  width:100%;
  height:320px;
  overflow:hidden;
  border-radius:28px;
  margin-bottom:26px;
  background:#000;
  isolation:isolate;
}

.bw-hero::after{
  content:'';
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(5,1,10,0.9)
    );

  z-index:1;
}

.bw-hero img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;

  transform:scale(1.05);
  transition:
    transform 0.12s linear;
}

.bw-hero-content{
  position:absolute;
  left:40px;
  bottom:34px;
  z-index:2;
  color:white;
  max-width:680px;
}

.bw-hero-kicker{
  font-size:12px;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0.7;
  margin-bottom:12px;
}

.bw-hero-title{
  font-family:'PT Serif', serif;
  font-size:56px;
  line-height:0.95;
  margin-bottom:16px;

  text-shadow:
    0 0 20px rgba(255,255,255,0.18),
    0 0 40px rgba(255,0,255,0.2);
}

.bw-hero-sub{
  font-size:15px;
  letter-spacing:1px;
  opacity:0.8;
  max-width:560px;
}

/* ================= TOP ================= */

.bw-top{
  position:relative;
  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;

  margin-bottom:30px;
}

.bw-search-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.bw-search-wrap{
  position:relative;
}

.bw-search{

  width:320px;

  padding:14px 42px 14px 18px;

  background:
    rgba(255,255,255,0.05);

  backdrop-filter:blur(14px);

  border:
    1px solid rgba(255,255,255,0.12);

  border-radius:14px;

  color:white;

  font-size:15px;

  outline:none;

  transition:0.25s ease;

  letter-spacing:1px;
}

.bw-search:focus{

  border-color:
    rgba(255,0,255,0.5);

  box-shadow:
    0 0 25px rgba(255,0,255,0.18);

  transform:
    translateY(-1px);
}

.bw-search::placeholder{
  color:rgba(255,255,255,0.35);
  letter-spacing:3px;
  text-transform:uppercase;
  font-size:11px;
}

.bw-search-icon{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:0.55;
}

/* FILTER */

.bw-filter-btn,
.bw-indicator{

  height:46px;

  background:
    rgba(255,255,255,0.05);

  border:
    1px solid rgba(255,255,255,0.12);

  backdrop-filter:blur(14px);

  border-radius:14px;

  color:white;
}

.bw-filter-btn{
  width:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:0.2s ease;
}

.bw-filter-btn:hover{
  border-color:rgba(255,0,255,0.5);
}

.bw-indicator{
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:12px;
  letter-spacing:1px;
}

/* DROPDOWN */

.bw-dropdown{
  position:absolute;
  top:58px;
  right:0;

  background:
    rgba(15,15,20,0.96);

  backdrop-filter:blur(18px);

  border:
    1px solid rgba(255,255,255,0.12);

  border-radius:16px;

  padding:8px;

  display:none;
  flex-direction:column;
  gap:4px;

  min-width:180px;

  z-index:999999;
}

.bw-dropdown button{

  background:none;
  border:none;

  color:white;

  text-align:left;

  padding:10px 12px;

  border-radius:10px;

  cursor:pointer;

  transition:0.18s ease;

  display:flex;
  justify-content:space-between;
}

.bw-dropdown button:hover{
  background:rgba(255,255,255,0.06);
}

.bw-dropdown button.active{
  background:white;
  color:black;
}

.bw-separator{
  height:1px;
  background:rgba(255,255,255,0.12);
  margin:4px 0;
}

/* TAGS */

.bw-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.bw-tag{

  background:
    rgba(255,255,255,0.08);

  border:
    1px solid rgba(255,255,255,0.1);

  color:white;

  padding:7px 12px;

  border-radius:999px;

  font-size:12px;

  cursor:pointer;

  transition:0.2s ease;
}

.bw-tag:hover{
  border-color:rgba(255,0,255,0.4);
  transform:translateY(-1px);
}

/* ================= FEATURED ================= */

.bw-featured-wrap{
  margin-bottom:32px;
}

.bw-section-title{
  color:white;
  font-family:'PT Serif', serif;
  font-size:24px;
  margin:0 0 16px 6px;
  text-shadow:0 0 20px rgba(255,0,255,0.2);
}

.bw-featured-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.bw-featured-card{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  aspect-ratio:16/9;
  text-decoration:none;
  background:#111;

  transition:
    transform 0.18s ease,
    border-color 0.2s ease;

  border:
    1px solid rgba(255,255,255,0.08);
}

.bw-featured-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.35s ease;
}

.bw-featured-card::after{
  content:'';
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.85),
      rgba(0,0,0,0.05)
    );
}

.bw-featured-name{
  position:absolute;
  left:18px;
  bottom:16px;

  z-index:2;

  color:white;

  font-family:'PT Serif', serif;

  font-size:24px;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.95),
    0 0 20px rgba(255,255,255,0.12);
}

.bw-featured-card:hover{
  border-color:rgba(255,0,255,0.35);
}

.bw-featured-card:hover img{
  transform:scale(1.06);
}

/* ================= GRID ================= */

.bw-grid{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:18px;

  width:100%;
}

/* CARD */

.bw-card{
  width:100%;
  aspect-ratio:1/1;

  position:relative;

  overflow:hidden;

  border-radius:20px;

  background:#111;

  text-decoration:none;

  border:
    1px solid rgba(255,255,255,0.08);

  transform-style:preserve-3d;

  transition:
    transform 0.12s linear,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.bw-card img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:
    transform 0.25s ease,
    filter 0.25s ease;
}

.bw-card::before{
  content:'';
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at var(--x,50%) var(--y,50%),
      rgba(255,255,255,0.16),
      transparent 42%
    );

  opacity:0;
  transition:opacity 0.2s ease;

  z-index:1;
}

.bw-card:hover::before{
  opacity:1;
}

.bw-card:hover{
  border-color:rgba(255,0,255,0.35);

  box-shadow:
    0 0 30px rgba(255,0,255,0.14);
}

.bw-card:hover img{
  transform:scale(1.06);
  filter:saturate(1.08);
}

/* OVERLAY */

.bw-overlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:flex-end;

  padding:14px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.88),
      rgba(0,0,0,0.12) 55%,
      transparent
    );

  z-index:2;
}

.bw-name{

  font-family:'PT Serif', serif;

  font-size:19px;

  color:white;

  line-height:1.1;

  transform:
    translateY(24px);

  opacity:0;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;

  text-shadow:
    0 2px 8px rgba(0,0,0,1),
    0 0 18px rgba(255,255,255,0.14);
}

.bw-card:hover .bw-name{
  transform:translateY(0);
  opacity:1;
}

/* RANDOM */

#bw-random-card .bw-name{
  opacity:1 !important;
  transform:translateY(0) !important;
}

#bw-random-card{
  border-color:rgba(255,0,255,0.25);
}

/* MOBILE */

@media (max-width:1400px){

  .bw-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bw-featured-row{
    grid-template-columns:repeat(2,1fr);
  }
}

@media (max-width:950px){

  .bw-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .bw-hero{
    height:260px;
  }

  .bw-hero-title{
    font-size:40px;
  }

  .bw-featured-row{
    grid-template-columns:1fr;
  }
}

@media (max-width:650px){

  #bw-cursor-glow{
    display:none;
  }

  .bw-grid{
    grid-template-columns:1fr;
  }

  .bw-search{
    width:100%;
  }

  .bw-search-row{
    width:100%;
  }

  .bw-search-wrap{
    flex:1;
    width:100%;
  }

  .bw-hero{
    height:220px;
  }

  .bw-hero-content{
    left:24px;
    bottom:24px;
  }

  .bw-hero-title{
    font-size:32px;
  }
}
</style>

<div id="bw-cursor-glow"></div>

<!-- HERO -->

<div class="bw-hero" id="bw-hero">
  <img
    id="bw-hero-img"
    src="https://pbs.twimg.com/media/G8QFE9VaQAA4XOT.jpg"
  >

  <div class="bw-hero-content">
    <div class="bw-hero-kicker">BlazeWingz Library</div>

    <div class="bw-hero-title">
      Play<br>
      The Impossible
    </div>

    <div class="bw-hero-sub">
      Native games. Browser shouldn’t be doing this.
    </div>
  </div>
</div>

<!-- SEARCH -->

<div class="bw-top">

  <div class="bw-search-row">

    <div class="bw-search-wrap">

      <input
        id="bw-search"
        class="bw-search"
        placeholder="SEARCH THE ARCHIVES..."
      >

      <svg class="bw-search-icon" viewBox="0 0 24 24" fill="white">
        <path d="M10 2a8 8 0 105.29 14.29l4.71 4.7 1.41-1.41-4.7-4.71A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
      </svg>

    </div>

    <div class="bw-filter-btn" id="bw-filter-btn">

      <svg width="18" height="18" fill="white">
        <rect y="3" width="18" height="2"/>
        <rect y="8" width="14" height="2"/>
        <rect y="13" width="10" height="2"/>
      </svg>

      <div class="bw-dropdown" id="bw-dropdown">

        <button data-sort="az">A–Z</button>

        <button data-sort="za">Z–A</button>

        <div class="bw-separator"></div>

        <button data-filter="multiplayer">Multiplayer</button>

        <button data-filter="featured">Featured</button>

      </div>

    </div>

    <div class="bw-indicator" id="bw-indicator">
      A–Z
    </div>

  </div>

  <div class="bw-tags" id="bw-tags"></div>

</div>

<!-- FEATURED -->

<div class="bw-featured-wrap">

  <div class="bw-section-title">
    Featured
  </div>

  <div class="bw-featured-row" id="bw-featured-row"></div>

</div>

<!-- GRID -->

<div class="bw-grid" id="bw-grid">

  <!-- KEEP YOUR GAME CARDS HERE EXACTLY AS THEY ALREADY ARE -->

</div>

<script>

/* ================= ELEMENTS ================= */

const grid =
  document.getElementById("bw-grid");

const dropdown =
  document.getElementById("bw-dropdown");

const filterBtn =
  document.getElementById("bw-filter-btn");

const searchInput =
  document.getElementById("bw-search");

const tagsEl =
  document.getElementById("bw-tags");

const indicator =
  document.getElementById("bw-indicator");

const hero =
  document.getElementById("bw-hero");

const heroImg =
  document.getElementById("bw-hero-img");

const glow =
  document.getElementById("bw-cursor-glow");

const featuredRow =
  document.getElementById("bw-featured-row");

/* ================= DATA ================= */

const multiplayer = [
  "Minecraft",
  "YOMI Hustle",
  "Cheese Rolling"
];

const featured = [
  "Balatro",
  "Minecraft",
  "Terraria",
  "YOMI Hustle"
];

let filters = [];
let search = "";
let sortMode = "az";

const cards =
  Array.from(
    grid.querySelectorAll(".bw-card")
  );

const randomCard =
  document.getElementById("bw-random-card");

const randomImg =
  document.getElementById("bw-random-img");

const normalCards =
  cards.filter(c => c !== randomCard);

/* ================= FEATURED ================= */

featured.forEach(name => {

  const match =
    normalCards.find(card =>
      card.querySelector(".bw-name")
      .innerText
      .trim() === name
    );

  if(!match) return;

  const clone =
    match.cloneNode(true);

  clone.classList.add("bw-featured-card");

  clone.innerHTML = `
    <img src="${match.querySelector("img").src}">
    <div class="bw-featured-name">${name}</div>
  `;

  featuredRow.appendChild(clone);

});

/* ================= DROPDOWN ================= */

filterBtn.onclick = e => {

  e.stopPropagation();

  dropdown.style.display =
    dropdown.style.display === "flex"
      ? "none"
      : "flex";
};

document.addEventListener(
  "click",
  () => dropdown.style.display = "none"
);

dropdown.querySelectorAll("button")
.forEach(btn => {

  btn.onclick = () => {

    const s =
      btn.dataset.sort;

    const f =
      btn.dataset.filter;

    if(s){
      sortMode = s;
    }

    if(f){

      if(filters.includes(f)){

        filters =
          filters.filter(x => x !== f);

      } else {

        filters.push(f);

      }

    }

    updateUI();
    render();

  };

});

/* ================= UI ================= */

function updateUI(){

  dropdown
  .querySelectorAll("[data-sort]")
  .forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.sort === sortMode
    );

  });

  tagsEl.innerHTML = "";

  filters.forEach(f => {

    const tag =
      document.createElement("div");

    tag.className =
      "bw-tag";

    tag.innerText =
      f + " ✕";

    tag.onclick = () => {

      filters =
        filters.filter(x => x !== f);

      updateUI();
      render();

    };

    tagsEl.appendChild(tag);

  });

  let text =
    sortMode === "az"
      ? "A–Z"
      : "Z–A";

  if(filters.length){
    text += " • " + filters.join(", ");
  }

  indicator.textContent = text;

}

/* ================= SEARCH ================= */

searchInput.oninput = e => {

  search =
    e.target.value.toLowerCase();

  render();

};

/* ================= RENDER ================= */

function render(){

  let list = [...normalCards];

  list.sort((a,b) => {

    const aName =
      a.querySelector(".bw-name")
      .innerText.trim();

    const bName =
      b.querySelector(".bw-name")
      .innerText.trim();

    return sortMode === "az"
      ? aName.localeCompare(bName)
      : bName.localeCompare(aName);

  });

  grid.innerHTML = "";

  grid.appendChild(randomCard);

  list.forEach(card => {

    const cleanName =
      card.querySelector(".bw-name")
      .innerText.trim();

    const lowerName =
      cleanName.toLowerCase();

    if(
      search &&
      !lowerName.includes(search)
    ){
      return;
    }

    for(let f of filters){

      if(
        f === "multiplayer" &&
        !multiplayer.includes(cleanName)
      ){
        return;
      }

      if(
        f === "featured" &&
        !featured.includes(cleanName)
      ){
        return;
      }

    }

    grid.appendChild(card);

  });

}

/* ================= RANDOM CARD ================= */

function pick(){

  return normalCards[
    Math.floor(
      Math.random() * normalCards.length
    )
  ];

}

let currentRandom =
  pick();

function updateRandom(){

  currentRandom =
    pick();

  randomImg.style.opacity = 0;

  setTimeout(() => {

    randomImg.src =
      currentRandom
      .querySelector("img")
      .src;

    randomImg.style.opacity = 1;

  },180);

}

setInterval(updateRandom,5000);

updateRandom();

randomCard.onclick = e => {

  e.preventDefault();

  window.open(
    currentRandom.href,
    "_blank"
  );

};

/* ================= MOUSE FX ================= */

document.addEventListener(
  "mousemove",
  e => {

    glow.style.left =
      e.clientX + "px";

    glow.style.top =
      e.clientY + "px";

    /* HERO */

    const heroRect =
      hero.getBoundingClientRect();

    const hx =
      (e.clientX - heroRect.left)
      / heroRect.width;

    const hy =
      (e.clientY - heroRect.top)
      / heroRect.height;

    heroImg.style.transform = `
      scale(1.08)
      translate(
        ${(hx - 0.5) * -18}px,
        ${(hy - 0.5) * -18}px
      )
    `;

    /* CARD WIGGLE */

    document
    .querySelectorAll(".bw-card")
    .forEach(card => {

      const rect =
        card.getBoundingClientRect();

      const x =
        e.clientX - rect.left;

      const y =
        e.clientY - rect.top;

      if(
        x < 0 ||
        y < 0 ||
        x > rect.width ||
        y > rect.height
      ){

        card.style.transform =
          "perspective(1000px) rotateX(0deg) rotateY(0deg)";

        return;

      }

      const rotateY =
        ((x / rect.width) - 0.5) * 10;

      const rotateX =
        ((y / rect.height) - 0.5) * -10;

      card.style.setProperty(
        "--x",
        `${x}px`
      );

      card.style.setProperty(
        "--y",
        `${y}px`
      );

      card.style.transform = `
        perspective(1000px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        translateY(-4px)
      `;

    });

  }
);

document
.querySelectorAll(".bw-card")
.forEach(card => {

  card.addEventListener(
    "mouseleave",
    () => {

      card.style.transform =
        "perspective(1000px) rotateX(0deg) rotateY(0deg)";

    }
  );

});

/* ================= INIT ================= */

updateUI();
render();

</script>
