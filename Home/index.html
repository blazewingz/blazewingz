<style>

:root{
    --accent:#ff00ff;
    --glow:rgba(255,0,255,0.4);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05010a;
    font-family:'PT Serif', serif;
    cursor:default;
}

/* VIDEO */

.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    pointer-events:none;

    transform:scale(1.03);

    filter:
        brightness(0.9)
        saturate(1.08)
        contrast(1.03);

    transition:transform 0.4s ease;
}

/* OVERLAY */

body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,0) 0%,
            rgba(5,0,15,0.22) 100%
        );

    z-index:1;
    pointer-events:none;
}

/* CURSOR GLOW */

#cursor-glow{
    position:fixed;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,255,0.08) 0%,
            rgba(255,0,255,0.03) 40%,
            transparent 75%
        );

    pointer-events:none;

    z-index:2;

    transform:translate(-50%,-50%);

    transition:
        transform 0.08s linear;

    opacity:0.55;
}

/* MAIN */

.main-ui{
    position:relative;
    z-index:10;

    width:90%;
    max-width:900px;

    margin:auto;

    text-align:center;
    color:white;

    top:50%;

    transform:
        translateY(-50%)
        perspective(1400px)
        rotateX(0deg)
        rotateY(0deg);

    transition:
        transform 0.12s ease-out;
}

/* FADE */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* GLOW */

@keyframes glowPulse{

    0%{
        text-shadow:
            0 0 10px rgba(200,100,255,0.8),
            0 0 30px rgba(180,80,255,0.4),
            0 0 45px rgba(150,60,255,0.25);
    }

    50%{
        text-shadow:
            0 0 20px rgba(220,140,255,1),
            0 0 40px rgba(200,100,255,0.6),
            0 0 60px rgba(180,80,255,0.4);
    }

    100%{
        text-shadow:
            0 0 10px rgba(200,100,255,0.8),
            0 0 30px rgba(180,80,255,0.4),
            0 0 45px rgba(150,60,255,0.25);
    }

}

/* FLOAT */

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

}

/* SEARCH APPEAR */

@keyframes resultIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(0.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

/* DAY */

#day-box{

    font-family:'Space Age', sans-serif;

    font-size:80px;

    letter-spacing:12px;

    margin-bottom:10px;

    text-transform:uppercase;

    opacity:0;

    animation:
        fadeIn 2s ease forwards,
        glowPulse 6s ease-in-out infinite,
        float 4s ease-in-out infinite;

    animation-delay:
        0.2s,
        0s,
        0s;
}

/* DATE */

#date-box{

    font-size:20px;

    letter-spacing:5px;

    margin-bottom:12px;

    opacity:0;

    animation:
        fadeIn 2s ease forwards,
        glowPulse 6s ease-in-out infinite;

    animation-delay:
        0.6s,
        0s;
}

/* TIME */

#time-box{

    font-size:22px;

    letter-spacing:6px;

    margin-bottom:35px;

    opacity:0;

    animation:
        fadeIn 2s ease forwards,
        glowPulse 6s ease-in-out infinite;

    animation-delay:
        1s,
        0s;
}

/* TYPEWRITER */

.type-wrap{

    height:30px;

    margin-bottom:40px;

    font-family:'Courier New', monospace;

    letter-spacing:2px;

    font-weight:bold;

    color:#ee00ff;

    text-shadow:
        0 0 8px var(--glow);

    opacity:0;

    animation:
        fadeIn 2s ease forwards;

    animation-delay:1.4s;
}

/* SEARCH */

.home-search{
    width:100%;
    max-width:520px;
    margin:auto;
    position:relative;
    z-index: 100;
    opacity:0;
    animation:
        fadeIn 2s ease forwards;
    animation-delay:1.8s;
}
    
.home-search input{

    width:100%;

    padding:18px 0;

    background:transparent;

    border:none;

    border-bottom:2px solid rgba(255,255,255,0.18);

    color:white;

    font-size:20px;

    text-align:center;

    outline:none;

    transition:0.35s ease;

    font-family:'PT Serif', serif;

    letter-spacing:2px;

    backdrop-filter:blur(4px);
}

.home-search input:focus{

    border-bottom:2px solid var(--accent);

    box-shadow:
        0 10px 20px -10px var(--glow);

    letter-spacing:4px;
}

.home-search input::placeholder{

    color:rgba(255,255,255,0.28);

    text-transform:uppercase;

    font-size:14px;

    letter-spacing:4px;
}

/* RESULTS */

#search-results{

    position:absolute;

    top:100%;

    left:0;

    width:100%;

    margin-top:14px;

    display:flex;

    flex-direction:column;

    gap:10px;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(-6px);

    transition:
        opacity 0.22s ease,
        transform 0.22s ease;

    z-index:50;
}

#search-results.active{

    opacity:1;

    pointer-events:auto;

    transform:
        translateY(0);
}

.search-item{

    display:flex;

    align-items:center;

    gap:14px;

    padding:10px;

    border-radius:16px;

    background:rgba(0,0,0,0.32);

    backdrop-filter:blur(18px);

    border:
        1px solid rgba(255,255,255,0.08);

    text-decoration:none;

    color:white;

    transition:0.25s ease;

    overflow:hidden;

    opacity:0;

    animation:
        resultIn 0.3s ease forwards;
}

.search-item:hover{

    transform:
        scale(1.02)
        translateY(-2px);

    border-color:
        rgba(255,0,255,0.5);

    box-shadow:
        0 0 20px rgba(255,0,255,0.15);
}

.search-item img{

    width:60px;

    height:60px;

    object-fit:cover;

    border-radius:12px;

    flex-shrink:0;
}

.search-info{
    text-align:left;
}

.search-title{

    font-size:18px;

    margin-bottom:4px;
}

.search-sub{

    font-size:11px;

    opacity:0.6;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* QUICK LINKS */

.quick-links{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:12px;

    margin-top:140px;

    opacity:0;

    animation:
        fadeIn 2s ease forwards;

    animation-delay:2.2s;
}

.quick-links a{

    padding:10px 18px;

    border:
        1px solid rgba(255,255,255,0.14);

    background:
        rgba(255,255,255,0.04);

    backdrop-filter:blur(8px);

    color:white;

    text-decoration:none;

    border-radius:12px;

    transition:0.25s ease;

    font-size:14px;

    letter-spacing:1px;
}

.quick-links a:hover{

    transform:
        translateY(-2px);

    border-color:var(--accent);

    box-shadow:
        0 0 16px var(--glow);
}

/* CURSOR */

.cursor{

    border-right:2px solid var(--accent);

    animation:
        blink 1s step-end infinite;
}

@keyframes blink{

    50%{
        border-color:transparent;
    }

}

/* MOBILE */

@media (max-width:700px){

    #cursor-glow{
        display:none;
    }

    #day-box{
        font-size:42px;
        letter-spacing:6px;
    }

    #date-box{
        font-size:13px;
        letter-spacing:2px;
    }

    #time-box{
        font-size:15px;
        letter-spacing:4px;
    }

    .type-wrap{
        font-size:13px;
    }

    .home-search input{
        font-size:16px;
    }

}

/* GAME CARDS */

.bw-card {
    position: relative;
    display: inline-block;
    width: 200px;
    height: 200px;
    margin: 10px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s ease;
}

.bw-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.bw-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 0, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 0.3s ease;
    backdrop-filter: blur(4px);
}

.bw-card:hover .bw-overlay {
    opacity: 1;
}

.bw-name {
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 0 10px var(--glow);
}

</style>

        { once:true }
    );

});

/* CLOCK */

function updateTime(){

    const now =
        new Date();

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    document.getElementById("day-box").textContent =
        days[now.getDay()];

    document.getElementById("date-box").textContent =
        now.toLocaleDateString(
            'en-GB',
            {
                day:'numeric',
                month:'long',
                year:'numeric'
            }
        ).toUpperCase();

    const time =
        now.toLocaleTimeString(
            'en-GB',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );

    document.getElementById("time-box").textContent =
        `– ${time} –`;

}

updateTime();

setInterval(updateTime,1000);

/* TYPEWRITER */

const lines = [

    "Welcome to BlazeWingz",
    "You can report bugs by clicking on the 'Give Feedback' button at the bottom of every page.",
    "Website probably works.",
    "whats 9+10?",
    "bing chilling",
    "blazewingz, by blazewingz, for blazewingz."

];

let lIdx = 0;
let cIdx = 0;
let isDel = false;

function type(){

    const cur =
        lines[lIdx];

    document.getElementById("text").textContent =
        cur.substring(0,cIdx);

    if(!isDel && cIdx < cur.length){

        cIdx++;

        setTimeout(type,100);

    }

    else if(isDel && cIdx > 0){

        cIdx--;

        setTimeout(type,50);

    }

    else{

        isDel = !isDel;

        if(!isDel){

            lIdx =
                (lIdx + 1) % lines.length;

        }

        setTimeout(
            type,
            isDel ? 2000 : 500
        );

    }

}

type();

    const y =
        e.clientY;

    glow.style.left =
        x + "px";

    glow.style.top =
        y + "px";

    const rotateY =
        ((x / window.innerWidth) - 0.5) * 5;

    const rotateX =
        ((y / window.innerHeight) - 0.5) * -5;

    ui.style.transform = `
        translateY(-50%)
        perspective(1400px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)

/* SEARCH SYSTEM */

const parser =
    new DOMParser();

const doc =
    parser.parseFromString(
        gameCards,
        "text/html"
    );

const gameElements =
    [...doc.querySelectorAll(".bw-card")];

const games =
    gameElements.map(card => ({

        title:
            card.querySelector(".bw-name")
            ?.textContent
            ?.trim(),

        image:
            card.querySelector("img")
            ?.src,

        url:
            card.href

    }));

const input =
    document.getElementById("search-input");

const results =
    document.getElementById("search-results");

input.addEventListener("input", () => {

    const value =
        input.value
        .toLowerCase()
        .trim();

    if(!value){

        results.classList.remove("active");

        setTimeout(() => {

            results.innerHTML = "";

        },180);

        return;

    }

    const matches =
        games.filter(game =>
            game.title
            .toLowerCase()
            .includes(value)
        );

    results.innerHTML = "";

    if(matches.length === 0){

        results.classList.remove("active");

        return;

    }

    matches
    .slice(0,5)
    .forEach((game,i) => {

        const a =
            document.createElement("a");

        a.className =
            "search-item";

        a.href =
            game.url;

        a.target =
            "_blank";

        a.style.animationDelay =
            `${i * 0.045}s`;

        a.innerHTML = `

            <img src="${game.image}">

            <div class="search-info">

                <div class="search-title">
                    ${game.title}
                </div>

                <div class="search-sub">
                    Launch Game
                </div>

            </div>

        `;

        results.appendChild(a);

    });

    requestAnimationFrame(() => {

        results.classList.add("active");

    });

});

/* ENTER = FIRST RESULT */

input.addEventListener("keydown", e => {

    if(e.key === "Enter"){

        const first =
            results.querySelector(".search-item");

        if(first){

            window.open(
                first.href,
                "_blank"
            );

        }

    }

});

</script>
