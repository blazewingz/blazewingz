<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #f1f1f1;
            letter-spacing: 1px;
        }
        .search-box {
            display: flex;
            background: #1c1c21;
            border: 1px solid #2d2d35;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }
        .search-box:focus-within {
            border-color: #6366f1;
        }
        input {
            flex-grow: 1;
            padding: 16px 20px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #6b6b76;
        }
        button {
            padding: 0 24px;
            background: #6366f1;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
        /* The fullscreen frame that hides the UI */
        #frame-container {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(20, 20, 20, 0.8);
            color: white;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        #close-btn:hover {
            background: rgba(220, 38, 38, 0.9);
            border-color: rgba(220, 38, 38, 0.9);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>BlazeWingz Gateway</h1>
        <div class="search-box">
            <input type="text" id="url-input" placeholder="Enter target URL..." onkeydown="if(event.key==='Enter') loadSite()">
            <button onclick="loadSite()">Connect</button>
        </div>
    </div>

    <div id="frame-container">
        <button id="close-btn" onclick="closeSite()">✕ Close Connection</button>
        <iframe id="viewer" src=""></iframe>
    </div>

    <script>
        function loadSite() {
            let url = document.getElementById('url-input').value.trim();
            if (!url) return;

            // Auto-add https if the user forgets it
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // Hide the UI and show the full-screen iframe
            document.getElementById('ui-container').style.display = 'none';
            document.getElementById('frame-container').style.display = 'block';
            
            // Inject the URL directly into the iframe
            document.getElementById('viewer').src = url;
        }

        function closeSite() {
            // Kill the iframe feed and bring back the search bar
            document.getElementById('viewer').src = "";
            document.getElementById('frame-container').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
        }
    </script>
</body>
</html>
