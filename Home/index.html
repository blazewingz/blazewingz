<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazeWingz | Algebra</title>
    
    <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff00ff;
            --glow: rgba(255, 0, 255, 0.4);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05010a; /* Matches the dark theme */
            font-family: 'Playfair Display', serif;
        }

        /* THE VIDEO LAYER */
        #video-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Sits behind everything */
            overflow: hidden;
        }

        .bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* THE OVERLAY GRADIENT */
        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(11, 2, 20, 0.8) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* UI ELEMENTS */
        .main-ui {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        #day-box {
            font-family: 'Space Age', sans-serif;
            font-size: 5rem;
            letter-spacing: 12px;
            text-shadow: 0 0 20px var(--glow);
            animation: float 4s ease-in-out infinite;
        }

        #date-box {
            font-size: 1.2rem;
            letter-spacing: 5px;
            font-style: italic;
            opacity: 0.8;
            margin: 10px 0 30px;
        }

        .type-wrap {
            height: 30px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
            text-shadow: 0 0 8px var(--glow);
            font-weight: bold;
        }

        .home-search input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            color: white;
            padding: 15px;
            width: 400px;
            text-align: center;
            font-size: 1.2rem;
            outline: none;
            transition: 0.4s;
            margin-top: 30px;
        }

        .home-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 10px 20px -10px var(--glow);
        }

        .quick-links {
            margin-top: 40px;
            display: flex;
            gap: 15px;
        }

        .quick-links a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border-radius: 5px;
            transition: 0.3s;
        }

        .quick-links a:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @media (max-width: 768px) {
            #day-box { font-size: 2.5rem; }
            .home-search input { width: 80%; }
        }
    </style>
</head>
<body>

    <div id="video-viewport">
        <video 
            id="bg-video"
            class="bg-video" 
            autoplay 
            muted 
            loop 
            playsinline 
            preload="auto"
        >
            <source src="https://raw.githubusercontent.com/blazewingz/blazewingz/blazewingz/Home/Assets/bg.mov" type="video/quicktime">
        </video>
    </div>

    <div class="overlay"></div>

    <div class="main-ui">
        <div id="day-box"></div>
        <div id="date-box"></div>
        <div class="type-wrap">
            <span id="text"></span><span class="cursor">|</span>
        </div>
        <div class="home-search">
            <input id="search" type="text" placeholder="SEARCH THE ARCHIVES...">
        </div>
        <div class="quick-links">
            <a href="https://sites.google.com/view/blazewingz/home">Library</a>
            <a href="https://sites.google.com/view/blazewingz/games/minecraft">Minecraft</a>
            <a href="https://sites.google.com/view/blazewingz/games/terraria">Terraria</a>
            <a href="https://sites.google.com/view/blazewingz/games/yomi-hustle">YOMI Hustle</a>
        </div>
    </div>

    <script>
        // Force the video to play regardless of browser stinginess
        const v = document.getElementById('bg-video');
        v.play().catch(() => {
            console.log("Autoplay blocked. Waiting for user interaction.");
            window.addEventListener('click', () => v.play(), { once: true });
        });

        // Clock Logic
        function update() {
            const now = new Date();
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            document.getElementById("day-box").innerText = days[now.getDay()];
            document.getElementById("date-box").innerText = now.toLocaleDateString('en-GB', {
                day: 'numeric', month: 'long', year: 'numeric'
            }).toUpperCase();
        }
        setInterval(update, 1000);
        update();

        // Typewriter Logic
        const lines = ["WELCOME TO BLAZEWINGZ.", "SYSTEMS OPERATIONAL.", "276 PLAYERS RESPONDED.", "FULL DOOM SERIES INSTALLED."];
        let lIdx = 0, cIdx = 0, isDel = false;
        function type() {
            const cur = lines[lIdx];
            document.getElementById("text").innerText = cur.substring(0, cIdx);
            if (!isDel && cIdx < cur.length) { cIdx++; setTimeout(type, 100); }
            else if (isDel && cIdx > 0) { cIdx--; setTimeout(type, 50); }
            else {
                isDel = !isDel;
                if (!isDel) lIdx = (lIdx + 1) % lines.length;
                setTimeout(type, isDel ? 2000 : 500);
            }
        }
        type();

        // Search Redirect
        document.getElementById("search").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                window.location.href = "https://sites.google.com/view/blazewingz/home?search=" + encodeURIComponent(e.target.value);
            }
        });
    </script>
</body>
</html>
