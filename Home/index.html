<style>
@import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap');

/* =========================
   GLOBAL
========================= */

:root{
  --bw-gap:16px;
  --bw-radius:14px;
}

body{
  overflow-x:hidden;
}

/* =========================
   HERO BANNER
========================= */

.bw-hero{
  position:relative;
  width:100%;
  height:340px;
  overflow:hidden;
  border-radius:18px;
  margin-bottom:28px;
  background:#000;
}

.bw-hero video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.55;
}

.bw-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,0.2),
      rgba(0,0,0,0.55),
      rgba(0,0,0,0.9));
}

.bw-hero-content{
  position:relative;
  z-index:2;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:32px;
  color:white;
}

.bw-hero-title{
  font-family:'PT Serif', serif;
  font-size:54px;
  line-height:1;
  margin-bottom:10px;
  text-shadow:0 8px 30px rgba(0,0,0,0.8);
}

.bw-hero-sub{
  font-size:15px;
  opacity:0.85;
  max-width:700px;
}

/* =========================
   STICKY SEARCH
========================= */

.bw-search-sticky{
  position:sticky;
  top:10px;
  z-index:999;
  margin-bottom:24px;
}

.bw-search-shell{
  backdrop-filter:blur(12px);
  background:rgba(12,12,12,0.78);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.35);
}

.bw-top{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.bw-search-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.bw-search-wrap{
  position:relative;
  flex:1;
}

.bw-search{
  width:100%;
  height:42px;
  border:none;
  outline:none;
  padding:0 42px 0 14px;
  background:#111;
  color:white;
  border-radius:10px;
  font-size:14px;
}

.bw-search-icon{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  opacity:0.55;
}

.bw-filter-btn,
.bw-indicator{
  height:42px;
  background:#111;
  border:1px solid rgba(255,255,255,0.12);
  color:white;
  border-radius:10px;
}

.bw-filter-btn{
  width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.bw-indicator{
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:13px;
  white-space:nowrap;
}

.bw-dropdown{
  position:absolute;
  top:50px;
  right:0;
  width:190px;
  background:rgba(18,18,18,0.96);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:6px;
  display:none;
  flex-direction:column;
  gap:4px;
  backdrop-filter:blur(12px);
}

.bw-dropdown button{
  background:none;
  border:none;
  color:white;
  text-align:left;
  padding:9px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.bw-dropdown button:hover{
  background:rgba(255,255,255,0.08);
}

.bw-dropdown button.active{
  background:white;
  color:black;
}

.bw-separator{
  height:1px;
  background:rgba(255,255,255,0.1);
  margin:4px 0;
}

.bw-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.bw-tag{
  background:white;
  color:black;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
}

/* =========================
   FEATURED
========================= */

.bw-featured{
  margin-bottom:28px;
}

.bw-featured-card{
  position:relative;
  display:block;
  overflow:hidden;
  border-radius:18px;
  height:260px;
  text-decoration:none;
}

.bw-featured-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform 0.5s ease;
}

.bw-featured-card:hover img{
  transform:scale(1.05);
}

.bw-featured-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:24px;
  background:
    linear-gradient(to top,
      rgba(0,0,0,0.82),
      rgba(0,0,0,0.1));
}

.bw-featured-label{
  font-size:12px;
  opacity:0.7;
  color:white;
  margin-bottom:6px;
}

.bw-featured-title{
  font-family:'PT Serif', serif;
  font-size:34px;
  color:white;
}

/* =========================
   GRID
========================= */

.bw-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:var(--bw-gap);
}

@media(max-width:1500px){
  .bw-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:1100px){
  .bw-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:800px){
  .bw-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:560px){
  .bw-grid{
    grid-template-columns:1fr;
  }
}

/* =========================
   CARDS
========================= */

.bw-card{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:var(--bw-radius);
  background:#111;
  text-decoration:none;
  transition:
    transform 0.18s ease,
    opacity 0.25s ease;
}

.bw-card.hidden{
  display:none;
}

.bw-card:hover{
  transform:translateY(-3px);
}

.bw-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform 0.45s ease;
}

.bw-card:hover img{
  transform:scale(1.06);
}

.bw-card::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  background:
    linear-gradient(to top,
      rgba(0,0,0,0.78),
      rgba(0,0,0,0));
}

.bw-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:14px;
  z-index:2;
}

.bw-name{
  font-family:'PT Serif', serif;
  font-size:18px;
  color:white;

  transform:translateY(180%);
  transition:transform 0.35s cubic-bezier(.2,.8,.2,1);

  text-shadow:
    0 3px 8px rgba(0,0,0,0.9),
    0 10px 20px rgba(0,0,0,0.85);

  -webkit-text-stroke:0.6px black;
}

.bw-card:hover .bw-name{
  transform:translateY(0);
}

/* RANDOM CARD ALWAYS VISIBLE */
#bw-random-card .bw-name{
  transform:translateY(0);
}

#bw-random-img{
  transition:opacity 0.45s ease;
}

/* SECTION TITLE */

.bw-section-title{
  font-family:'PT Serif', serif;
  color:white;
  font-size:32px;
  margin:
    10px 0
    18px;
}
</style>

<!-- =========================
     HERO
========================= -->

<div class="bw-hero">
  <video autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/blazewingz/blazewingz/blazewingz/Home/Assets/bg.mp4" type="video/mp4">
  </video>

  <div class="bw-hero-content">
    <div class="bw-hero-title">BlazeWingz</div>
    <div class="bw-hero-sub">
      Somehow running games that absolutely should not be running on school WiFi.
    </div>
  </div>
</div>

<!-- =========================
     SEARCH
========================= -->

<div class="bw-search-sticky">

<div class="bw-search-shell">

<div class="bw-top">

<div class="bw-search-row">

<div class="bw-search-wrap">
<input id="bw-search" class="bw-search" placeholder="Search Library...">

<svg class="bw-search-icon" viewBox="0 0 24 24" fill="white">
<path d="M10 2a8 8 0 105.29 14.29l4.71 4.7 1.41-1.41-4.7-4.71A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
</svg>
</div>

<div class="bw-filter-btn" id="bw-filter-btn">

<svg width="18" height="18" fill="white">
<rect y="3" width="18" height="2"/>
<rect y="8" width="14" height="2"/>
<rect y="13" width="10" height="2"/>
</svg>

<div class="bw-dropdown" id="bw-dropdown">

<button data-sort="az">A–Z</button>
<button data-sort="za">Z–A</button>

<div class="bw-separator"></div>

<button data-filter="multiplayer">Multiplayer</button>
<button data-filter="featured">Featured</button>

</div>
</div>

<div class="bw-indicator" id="bw-indicator">
A–Z
</div>

</div>

<div class="bw-tags" id="bw-tags"></div>

</div>
</div>
</div>

<!-- =========================
     FEATURED
========================= -->

<div class="bw-featured" id="bw-featured"></div>

<div class="bw-section-title">
Library
</div>

<!-- =========================
     GRID
========================= -->

<div class="bw-grid" id="bw-grid">

<!-- RANDOM -->
<a href="#" class="bw-card" id="bw-random-card">
<img id="bw-random-img">
<div class="bw-overlay">
<div class="bw-name">Random Game</div>
</div>
</a>

<!-- BROTATO -->
<a href="https://sites.google.com/view/blazewingz/games/brotato" target="_blank" class="bw-card" data-name="Brotato">
<img src="https://www.nintendo.com/eu/media/images/11_square_images/games_18/nintendo_switch_download_software/1x1_NSwitchDS_Brotato_image500w.jpg">
<div class="bw-overlay"><div class="bw-name">Brotato</div></div>
</a>

<!-- MINECRAFT -->
<a href="https://sites.google.com/view/blazewingz/games/minecraft" target="_blank" class="bw-card" data-name="Minecraft">
<img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Minecraft/Minecraft%20Logo.png?raw=true">
<div class="bw-overlay"><div class="bw-name">Minecraft</div></div>
</a>

<!-- YOMI -->
<a href="https://sites.google.com/view/blazewingz/games/yomi-hustle" target="_blank" class="bw-card" data-name="YOMI Hustle">
<img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/YOMI%20Hustle/YOMI-Hustle.png?raw=true">
<div class="bw-overlay"><div class="bw-name">YOMI Hustle</div></div>
</a>

<!-- BALATRO -->
<a href="https://sites.google.com/view/blazewingz/games/balatro" target="_blank" class="bw-card" data-name="Balatro">
<img src="https://i.scdn.co/image/ab67616d0000b273b153ba98e093ff8841fc5d73">
<div class="bw-overlay"><div class="bw-name">Balatro</div></div>
</a>

<!-- TERRARIA -->
<a href="https://sites.google.com/view/blazewingz/games/terraria" target="_blank" class="bw-card" data-name="Terraria">
<img src="https://forums.terraria.org/index.php?attachments/icon-png.280655/">
<div class="bw-overlay"><div class="bw-name">Terraria</div></div>
</a>

<!-- ULTRAKILL -->
<a href="https://sites.google.com/view/blazewingz/games/ultrakill" target="_blank" class="bw-card" data-name="Ultrakill">
<img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Ultrakill/Ultrakill.png?raw=true">
<div class="bw-overlay"><div class="bw-name">Ultrakill</div></div>
</a>

<!-- CELESTE -->
<a href="https://sites.google.com/view/blazewingz/games/celeste" target="_blank" class="bw-card" data-name="Celeste">
<img src="https://github.com/blazewingz/Assets/blob/blazewingz/Assets/Celeste/Celeste.png?raw=true">
<div class="bw-overlay"><div class="bw-name">Celeste</div></div>
</a>

<!-- FNAF -->
<a href="https://sites.google.com/view/blazewingz/games/fnaf" target="_blank" class="bw-card" data-name="Five Nights at Freddy's">
<img src="https://cdn2.steamgriddb.com/icon/6aab1270668d8cac7cef2566a1c5f569.png">
<div class="bw-overlay"><div class="bw-name">Five Nights at Freddy's</div></div>
</a>

</div>

<script>
/* =========================
   ELEMENTS
========================= */

const grid = document.getElementById("bw-grid");
const searchInput = document.getElementById("bw-search");
const filterBtn = document.getElementById("bw-filter-btn");
const dropdown = document.getElementById("bw-dropdown");
const tagsEl = document.getElementById("bw-tags");
const indicator = document.getElementById("bw-indicator");

const randomCard = document.getElementById("bw-random-card");
const randomImg = document.getElementById("bw-random-img");

const cards = Array.from(
  document.querySelectorAll(".bw-card")
).filter(c => c !== randomCard);

/* =========================
   DATA
========================= */

const multiplayer = [
  "Minecraft",
  "YOMI Hustle"
];

const featured = [
  "Minecraft",
  "Balatro",
  "Terraria",
  "Brotato",
  "YOMI Hustle"
];

let filters = [];
let sortMode = "az";
let search = "";

/* =========================
   FEATURED HERO
========================= */

const featuredGames = [
{
  name:"Minecraft",
  link:"https://sites.google.com/view/blazewingz/games/minecraft",
  img:"https://static0.gamerantimages.com/wordpress/wp-content/uploads/2022/08/minecraft-4.jpg?w=1600&h=900&fit=crop"
},
{
  name:"YOMI Hustle",
  link:"https://sites.google.com/view/blazewingz/games/yomi-hustle",
  img:"https://images.steamusercontent.com/ugc/2038477893869161638/BB643F4DC6895EF1DBCA8AC1D613C5E3B7A55475/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true"
},
{
  name:"Brotato",
  link:"https://sites.google.com/view/blazewingz/games/brotato",
  img:"https://wallpapercave.com/wp/wp13551118.png"
}
];

const hero =
featuredGames[
  Math.floor(Math.random()*featuredGames.length)
];

document.getElementById("bw-featured").innerHTML = `
<a href="${hero.link}" target="_blank" class="bw-featured-card">
<img src="${hero.img}">
<div class="bw-featured-overlay">
<div class="bw-featured-label">
Featured
</div>
<div class="bw-featured-title">
${hero.name}
</div>
</div>
</a>
`;

/* =========================
   DROPDOWN
========================= */

filterBtn.onclick = e => {
  e.stopPropagation();

  dropdown.style.display =
    dropdown.style.display === "flex"
    ? "none"
    : "flex";
};

document.addEventListener("click", () => {
  dropdown.style.display = "none";
});

/* =========================
   BUTTONS
========================= */

dropdown.querySelectorAll("button").forEach(btn => {

  btn.onclick = () => {

    const sort = btn.dataset.sort;
    const filter = btn.dataset.filter;

    if(sort){
      sortMode = sort;
    }

    if(filter){

      if(filters.includes(filter)){
        filters =
          filters.filter(f => f !== filter);
      } else {
        filters.push(filter);
      }

    }

    updateUI();
    render();
  };

});

/* =========================
   SEARCH
========================= */

searchInput.addEventListener("input", e => {
  search = e.target.value.toLowerCase();
  render();
});

/* =========================
   UI
========================= */

function updateUI(){

  dropdown
  .querySelectorAll("[data-sort]")
  .forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.sort === sortMode
    );

  });

  tagsEl.innerHTML = "";

  filters.forEach(f => {

    const tag = document.createElement("div");

    tag.className = "bw-tag";
    tag.innerHTML = f + " ✕";

    tag.onclick = () => {

      filters =
        filters.filter(x => x !== f);

      updateUI();
      render();

    };

    tagsEl.appendChild(tag);

  });

  let label =
    sortMode === "az"
    ? "A–Z"
    : "Z–A";

  if(filters.length){
    label += " • " + filters.join(", ");
  }

  indicator.textContent = label;
}

/* =========================
   RENDER
========================= */

function render(){

  let visible = [...cards];

  visible.sort((a,b)=>{

    const aName =
      a.dataset.name.toLowerCase();

    const bName =
      b.dataset.name.toLowerCase();

    return sortMode === "az"
      ? aName.localeCompare(bName)
      : bName.localeCompare(aName);

  });

  visible.forEach(card => {

    const name =
      card.dataset.name;

    const lower =
      name.toLowerCase();

    let show = true;

    /* SEARCH */

    if(search && !lower.includes(search)){
      show = false;
    }

    /* FILTERS */

    filters.forEach(f => {

      if(
        f === "multiplayer" &&
        !multiplayer.includes(name)
      ){
        show = false;
      }

      if(
        f === "featured" &&
        !featured.includes(name)
      ){
        show = false;
      }

    });

    card.classList.toggle(
      "hidden",
      !show
    );

  });

  /* REORDER */

  visible.forEach(card => {
    grid.appendChild(card);
  });

}

/* =========================
   RANDOM CARD
========================= */

function pickRandom(){
  return cards[
    Math.floor(Math.random()*cards.length)
  ];
}

function updateRandom(){

  const picked = pickRandom();

  randomImg.style.opacity = 0;

  setTimeout(() => {

    randomImg.src =
      picked.querySelector("img").src;

    randomCard.href = picked.href;

    randomImg.style.opacity = 1;

  },220);

}

setInterval(updateRandom,5000);

updateRandom();

updateUI();
render();
</script>
