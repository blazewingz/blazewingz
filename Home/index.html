<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drod</title>
    <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Deep space color */
            background-color: #050512; 
            overflow: hidden;
            font-family: 'PT Serif', serif;
            color: #fff;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'enemyShoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        let state = 'MENU';
        let score = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Entities
        let ship;
        let lasers = [];
        let enemyLasers = [];
        let asteroids = [];
        let bgAsteroids = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        
        let frameCount = 0;

        // Initialize background environment once
        function initEnvironment() {
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 3 + 1 // Depth for parallax
                });
            }
            bgAsteroids = [];
            for(let i=0; i<8; i++) {
                let ast = {
                    x: Math.random() * width, y: Math.random() * height,
                    r: Math.random() * 40 + 30,
                    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02,
                    verts: []
                };
                let numVerts = Math.floor(Math.random() * 5 + 7);
                for (let j = 0; j < numVerts; j++) {
                    ast.verts.push(ast.r + Math.random() * ast.r * 0.4 - ast.r * 0.2);
                }
                bgAsteroids.push(ast);
            }
        }
        initEnvironment();

        function initGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            state = 'PLAYING';
            score = 0;
            frameCount = 0;
            ship = {
                x: width / 2, y: height / 2,
                r: 12, a: -Math.PI / 2,
                vx: 0, vy: 0, cooldown: 0
            };
            lasers = []; enemyLasers = [];
            asteroids = []; enemies = []; particles = [];
            
            for(let i=0; i<5; i++) spawnAsteroid();
        }

        window.addEventListener('mousedown', () => {
            if (state === 'MENU' || state === 'DEAD') initGame();
        });

        function spawnAsteroid(x, y, r) {
            let ast = {
                x: x !== undefined ? x : Math.random() * width,
                y: y !== undefined ? y : (Math.random() > 0.5 ? -50 : height + 50),
                r: r || (Math.random() * 25 + 20),
                vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                verts: []
            };
            if (x === undefined && Math.hypot(ast.x - width/2, ast.y - height/2) < 150) ast.x = -50; 
            let numVerts = Math.floor(Math.random() * 5 + 7);
            for (let i = 0; i < numVerts; i++) ast.verts.push(ast.r + Math.random() * ast.r * 0.4 - ast.r * 0.2);
            asteroids.push(ast);
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() > 0.5 ? -30 : width + 30,
                y: Math.random() * height,
                r: 14, a: 0, vx: 0, vy: 0,
                cooldown: 60
            });
        }

        function createExplosion(x, y, color, amount=20) {
            for (let i = 0; i < amount; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                    life: 1, decay: Math.random() * 0.02 + 0.02, color: color
                });
            }
        }

        function update() {
            frameCount++;

            // Parallax Environment (moves opposite to ship)
            let driftX = state === 'PLAYING' ? ship.vx : 0.5;
            let driftY = state === 'PLAYING' ? ship.vy : 0;
            
            stars.forEach(s => {
                s.x -= driftX / s.z;
                s.y -= driftY / s.z;
                if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
                if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
            });

            bgAsteroids.forEach(a => {
                a.x += a.vx - (driftX * 0.2);
                a.y += a.vy - (driftY * 0.2);
                a.rot += a.rotSpeed;
                if (a.x < -a.r*2) a.x = width + a.r*2; if (a.x > width + a.r*2) a.x = -a.r*2;
                if (a.y < -a.r*2) a.y = height + a.r*2; if (a.y > height + a.r*2) a.y = -a.r*2;
            });

            if (state === 'PLAYING') {
                // Ship Controls
                if (keys['ArrowLeft'] || keys['KeyA']) ship.a -= 0.1;
                if (keys['ArrowRight'] || keys['KeyD']) ship.a += 0.1;
                if (keys['ArrowUp'] || keys['KeyW']) {
                    ship.vx += Math.cos(ship.a) * 0.35;
                    ship.vy += Math.sin(ship.a) * 0.35;
                    particles.push({
                        x: ship.x - Math.cos(ship.a) * ship.r, y: ship.y - Math.sin(ship.a) * ship.r,
                        vx: -Math.cos(ship.a) * 5 + (Math.random()-0.5)*2, vy: -Math.sin(ship.a) * 5 + (Math.random()-0.5)*2,
                        life: 1, decay: 0.05, color: '#00ffff'
                    });
                }
                
                ship.vx *= 0.98; ship.vy *= 0.98;
                ship.x += ship.vx; ship.y += ship.vy;
                if (ship.x < 0) ship.x = width; if (ship.x > width) ship.x = 0;
                if (ship.y < 0) ship.y = height; if (ship.y > height) ship.y = 0;

                // Forgiving & Faster Shooting
                if (ship.cooldown > 0) ship.cooldown--;
                if (keys['Space'] && ship.cooldown === 0) {
                    lasers.push({
                        x: ship.x + Math.cos(ship.a) * ship.r, y: ship.y + Math.sin(ship.a) * ship.r,
                        vx: Math.cos(ship.a) * 22, vy: Math.sin(ship.a) * 22, // Faster lasers
                        life: 45
                    });
                    ship.cooldown = 12;
                    playSound('shoot');
                }

                // Enemy Spawning
                if (frameCount % 400 === 0 && enemies.length < 3) spawnEnemy();
            }

            // Update Player Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].x += lasers[i].vx; lasers[i].y += lasers[i].vy;
                lasers[i].life--;
                if (lasers[i].life <= 0) lasers.splice(i, 1);
            }

            // Update Enemy Lasers
            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                enemyLasers[i].x += enemyLasers[i].vx; enemyLasers[i].y += enemyLasers[i].vy;
                enemyLasers[i].life--;
                
                // Hit Player
                if (state === 'PLAYING') {
                    if (Math.hypot(enemyLasers[i].x - ship.x, enemyLasers[i].y - ship.y) < ship.r + 5) {
                        createExplosion(ship.x, ship.y, '#00ffff', 40);
                        playSound('die'); state = 'DEAD';
                        setTimeout(() => state = 'MENU', 2500);
                        enemyLasers.splice(i, 1);
                        continue;
                    }
                }
                if (enemyLasers[i].life <= 0) enemyLasers.splice(i, 1);
            }

            // Enemies AI & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (state === 'PLAYING') {
                    // Track player
                    let angleToPlayer = Math.atan2(ship.y - e.y, ship.x - e.x);
                    e.a = angleToPlayer;
                    e.vx += Math.cos(e.a) * 0.1; e.vy += Math.sin(e.a) * 0.1;
                    
                    // Shoot player
                    e.cooldown--;
                    if (e.cooldown <= 0 && Math.hypot(ship.x - e.x, ship.y - e.y) < 400) {
                        enemyLasers.push({
                            x: e.x + Math.cos(e.a)*e.r, y: e.y + Math.sin(e.a)*e.r,
                            vx: Math.cos(e.a) * 10, vy: Math.sin(e.a) * 10, life: 60
                        });
                        e.cooldown = 90;
                        playSound('enemyShoot');
                    }
                }
                e.vx *= 0.98; e.vy *= 0.98;
                e.x += e.vx; e.y += e.vy;
                if (e.x < -50) e.x = width+50; if (e.x > width+50) e.x = -50;
                if (e.y < -50) e.y = height+50; if (e.y > height+50) e.y = -50;

                // Hit by player laser
                let enemyDestroyed = false;
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (Math.hypot(lasers[j].x - e.x, lasers[j].y - e.y) < e.r + 15) { // Forgiving hitbox
                        createExplosion(e.x, e.y, '#ff3333');
                        playSound('boom');
                        enemies.splice(i, 1);
                        lasers.splice(j, 1);
                        score += 250;
                        enemyDestroyed = true;
                        break;
                    }
                }
                if (enemyDestroyed) continue;

                // Player crashing into enemy
                if (state === 'PLAYING' && Math.hypot(ship.x - e.x, ship.y - e.y) < ship.r + e.r) {
                    createExplosion(ship.x, ship.y, '#00ffff', 40);
                    playSound('die'); state = 'DEAD';
                    setTimeout(() => state = 'MENU', 2500);
                }
            }

            // Update Asteroids & Collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let a = asteroids[i];
                a.x += a.vx; a.y += a.vy;

                if (a.x < -a.r) a.x = width + a.r; if (a.x > width + a.r) a.x = -a.r;
                if (a.y < -a.r) a.y = height + a.r; if (a.y > height + a.r) a.y = -a.r;

                if (state === 'PLAYING') {
                    if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r * 0.8) {
                        createExplosion(ship.x, ship.y, '#00ffff', 40);
                        playSound('die'); state = 'DEAD';
                        setTimeout(() => state = 'MENU', 2500);
                    }
                }

                // Laser hitting asteroid (Forgiving Hitbox applied here: a.r + 15)
                for (let j = lasers.length - 1; j >= 0; j--) {
                    let l = lasers[j];
                    if (Math.hypot(l.x - a.x, l.y - a.y) < a.r + 15) { 
                        createExplosion(a.x, a.y, '#ff00ff');
                        playSound('boom');
                        
                        if (Math.random() < 0.20 && a.r > 15) {
                            spawnAsteroid(a.x, a.y, a.r / 1.5); spawnAsteroid(a.x, a.y, a.r / 1.5);
                        }
                        
                        asteroids.splice(i, 1); lasers.splice(j, 1);
                        score += 100;
                        if (asteroids.length < 3) spawnAsteroid(); 
                        break;
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                particles[i].life -= particles[i].decay;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 18, 0.4)'; // Dark blue/purple trail effect
            ctx.fillRect(0, 0, width, height);

            ctx.lineJoin = 'round'; ctx.lineCap = 'round';

            // Draw Parallax Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                let size = 1.5 / s.z;
                ctx.globalAlpha = 1 / s.z;
                ctx.beginPath(); ctx.arc(s.x, s.y, size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Background Asteroids
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            bgAsteroids.forEach(a => {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rot);
                ctx.beginPath();
                for (let i = 0; i < a.verts.length; i++) {
                    let angle = (i / a.verts.length) * Math.PI * 2;
                    let rx = Math.cos(angle) * a.verts[i];
                    let ry = Math.sin(angle) * a.verts[i];
                    if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
                }
                ctx.closePath(); ctx.stroke();
                ctx.restore();
            });

            // Draw Particles (Godrays)
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.life * 4, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12; ctx.shadowColor = p.color;
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

            // Draw Asteroids
            ctx.strokeStyle = '#ff00ff'; // Neon purple asteroids
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 5;
            ctx.lineWidth = 2;
            asteroids.forEach(a => {
                ctx.beginPath();
                for (let i = 0; i < a.verts.length; i++) {
                    let angle = (i / a.verts.length) * Math.PI * 2;
                    let rx = a.x + Math.cos(angle) * a.verts[i];
                    let ry = a.y + Math.sin(angle) * a.verts[i];
                    if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
                }
                ctx.closePath(); ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Enemies
            enemies.forEach(e => {
                ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.a);
                ctx.strokeStyle = '#ff3333'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff3333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.r, 0); ctx.lineTo(-e.r, -e.r * 0.8);
                ctx.lineTo(-e.r * 0.4, 0); ctx.lineTo(-e.r, e.r * 0.8);
                ctx.closePath(); ctx.stroke();
                ctx.restore();
            });

            // Draw Lasers
            ctx.lineWidth = 3;
            lasers.forEach(l => {
                ctx.strokeStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.vx*0.6, l.y - l.vy*0.6); ctx.stroke();
            });
            enemyLasers.forEach(l => {
                ctx.strokeStyle = '#ff3333'; ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.vx*0.6, l.y - l.vy*0.6); ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Ship
            if (state === 'PLAYING') {
                ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
                ctx.strokeStyle = '#00ffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ship.r, 0); ctx.lineTo(-ship.r, -ship.r * 0.7);
                ctx.lineTo(-ship.r * 0.5, 0); ctx.lineTo(-ship.r, ship.r * 0.7);
                ctx.closePath(); ctx.stroke();
                ctx.restore();
            }

            // Draw UI
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
            if (state === 'MENU') {
                ctx.font = '72px "Space Age", sans-serif';
                ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
                ctx.fillText('DROD', width / 2, height / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '24px "PT Serif", serif';
                ctx.fillText('CLICK TO START', width / 2, height / 2 + 50);
            } else if (state === 'DEAD') {
                ctx.font = '64px "Space Age", sans-serif';
                ctx.fillStyle = '#ff3333'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff3333';
                ctx.fillText('DESTROYED', width / 2, height / 2 - 20);
                ctx.shadowBlur = 0;
            }

            if (state === 'PLAYING' || state === 'DEAD') {
                ctx.font = '24px "Space Age", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#fff';
                ctx.fillText(`SCORE: ${score}`, 30, 50);
            }
        }

        function loop() {
            update(); draw(); requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
