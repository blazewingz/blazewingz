<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazeWingz | Algebra</title>
    
    <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff00ff;
            --glow: rgba(255, 0, 255, 0.4);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05010a;
            font-family: 'Playfair Display', serif;
        }

        /* BACKGROUND VIDEO */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* OVERLAY GRADIENT */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle,
                transparent 20%,
                rgba(11, 2, 20, 0.72) 100%
            );
            z-index: 1;
        }

        .main-ui {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 900px;
            margin: auto;
            text-align: center;
            color: white;
            top: 50%;
            transform: translateY(-50%);
        }

        /* CLOCK STYLING */
        #day-box {
            font-family: 'Space Age', sans-serif;
            font-size: 80px;
            letter-spacing: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            animation: float 4s ease-in-out infinite;
            text-shadow: 0 0 20px var(--glow);
        }

        #date-box {
            font-size: 18px;
            letter-spacing: 5px;
            font-style: italic;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        /* TYPEWRITER */
        .type-wrap {
            height: 30px;
            margin-bottom: 40px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 8px var(--glow);
        }

        /* SEARCH BAR */
        .home-search input {
            width: 100%;
            max-width: 500px;
            padding: 18px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 20px;
            text-align: center;
            outline: none;
            transition: all 0.4s ease;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }

        .home-search input:focus {
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 10px 20px -10px var(--glow);
            letter-spacing: 4px;
        }

        /* QUICK LINKS */
        .quick-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 40px;
        }

        .quick-links a {
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.25s ease;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .quick-links a:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--glow);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .cursor {
            border-right: 2px solid var(--accent);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { border-color: transparent; } }

        @media (max-width: 700px) {
            #day-box { font-size: 42px; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <video id="bg-video" class="bg-video" autoplay muted loop playsinline preload="auto">
        <source src="https://raw.githubusercontent.com/blazewingz/blazewingz/blazewingz/Home/Assets/bg.mp4" type="video/mp4">
    </video>

    <div class="main-ui">
        <div id="day-box"></div>
        <div id="date-box"></div>
        <div class="type-wrap">
            <span id="text"></span><span class="cursor"></span>
        </div>
        <div class="home-search">
            <input id="search-input" type="text" placeholder="SEARCH THE ARCHIVES...">
        </div>
        <div class="quick-links">
            <a href="https://sites.google.com/view/blazewingz/home">Library</a>
            <a href="https://sites.google.com/view/blazewingz/games/minecraft">Minecraft</a>
            <a href="https://sites.google.com/view/blazewingz/games/terraria">Terraria</a>
            <a href="https://sites.google.com/view/blazewingz/games/yomi-hustle">YOMI Hustle</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video');

        // SILENT FORCE PLAY
        video.play().catch(() => {
            window.addEventListener('click', () => video.play(), { once: true });
        });

        // CLOCK
        function updateTime() {
            const now = new Date();
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            document.getElementById("day-box").textContent = days[now.getDay()];
            document.getElementById("date-box").textContent = now.toLocaleDateString('en-GB', {
                day: 'numeric', month: 'long', year: 'numeric'
            }).toUpperCase();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // TYPEWRITER
        const lines = ["WELCOME TO BLAZEWINGZ.", "SYSTEMS OPERATIONAL.", "276 PLAYERS RESPONDED.", "FULL DOOM SERIES INSTALLED."];
        let lIdx = 0, cIdx = 0, isDel = false;
        function type() {
            const cur = lines[lIdx];
            document.getElementById("text").textContent = cur.substring(0, cIdx);
            if (!isDel && cIdx < cur.length) { cIdx++; setTimeout(type, 100); }
            else if (isDel && cIdx > 0) { cIdx--; setTimeout(type, 50); }
            else {
                isDel = !isDel;
                if (!isDel) lIdx = (lIdx + 1) % lines.length;
                setTimeout(type, isDel ? 2000 : 500);
            }
        }
        type();

        // SEARCH
        document.getElementById("search-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                window.location.href = "https://sites.google.com/view/blazewingz/home?search=" + encodeURIComponent(e.target.value);
            }
        });
    </script>
</body>
</html>
