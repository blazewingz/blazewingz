<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BlazeWingz | Home</title>

    <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">

    <style>

        :root {
            --accent: #ff00ff;
            --glow: rgba(255,0,255,0.4);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05010a;
            font-family: 'PT Serif', serif;
        }

        /* VIDEO */

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* OVERLAY */

        body::before {
            content: '';
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle,
                    transparent 20%,
                    rgba(11,2,20,0.72) 100%
                );

            z-index: 1;
        }

        /* MAIN */

        .main-ui {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 900px;

            margin: auto;

            text-align: center;
            color: white;

            top: 50%;
            transform: translateY(-50%);
        }

        /* CLOCK */

        #day-box {
            font-family: 'Space Age', sans-serif;
            font-size: 80px;
            letter-spacing: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;

            animation: float 4s ease-in-out infinite;

            text-shadow:
                0 0 20px var(--glow);
        }

        #date-box {
            font-size: 18px;
            letter-spacing: 5px;
            font-style: italic;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        /* TYPEWRITER */

        .type-wrap {
            height: 30px;
            margin-bottom: 40px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            font-weight: bold;
            color: #ee00ff;
            text-shadow:
                0 0 8px var(--glow);
        }

        /* SEARCH */

        .home-search {
            width: 100%;
            max-width: 520px;
            margin: auto;
            position: relative;
        }

        .home-search input {

            width: 100%;

            padding: 18px 0;

            background: transparent;

            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.2);

            color: white;

            font-size: 20px;
            text-align: center;

            outline: none;

            transition: 0.35s ease;

            font-family: 'PT Serif', serif;

            letter-spacing: 2px;

        }

        .home-search input:focus {

            border-bottom: 2px solid var(--accent);

            box-shadow:
                0 10px 20px -10px var(--glow);

            letter-spacing: 4px;

        }

        .home-search input::placeholder {

            color: rgba(255,255,255,0.3);

            text-transform: uppercase;

            font-size: 14px;

            letter-spacing: 4px;

        }

        /* SEARCH RESULTS */

        #search-results {

            width: 100%;

            margin-top: 14px;

            display: none;
            flex-direction: column;

            gap: 10px;

        }

        .search-item {

            display: flex;
            align-items: center;

            gap: 14px;

            padding: 10px;

            border-radius: 14px;

            background: rgba(0,0,0,0.45);

            backdrop-filter: blur(14px);

            border:
                1px solid rgba(255,255,255,0.08);

            text-decoration: none;
            color: white;

            transition: 0.25s ease;

        }

        .search-item:hover {

            transform: scale(1.02);

            border-color:
                rgba(255,0,255,0.5);

            box-shadow:
                0 0 20px rgba(255,0,255,0.2);

        }

        .search-item img {

            width: 60px;
            height: 60px;

            object-fit: cover;

            border-radius: 10px;

            flex-shrink: 0;

        }

        .search-info {
            text-align: left;
        }

        .search-title {

            font-size: 18px;
            margin-bottom: 4px;

        }

        .search-sub {

            font-size: 11px;

            opacity: 0.6;

            letter-spacing: 2px;

            text-transform: uppercase;

        }

        /* QUICK LINKS */

        .quick-links {

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 12px;

            margin-top: 40px;

        }

        .quick-links a {

            padding: 10px 18px;

            border:
                1px solid rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.04);

            backdrop-filter: blur(8px);

            color: white;

            text-decoration: none;

            border-radius: 10px;

            transition: 0.25s ease;

            font-size: 14px;

            letter-spacing: 1px;

        }

        .quick-links a:hover {

            transform: translateY(-2px);

            border-color: var(--accent);

            box-shadow:
                0 0 16px var(--glow);

        }

        /* FLOAT */

        @keyframes float {

            0%,100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

        }

        /* CURSOR */

        .cursor {

            border-right: 2px solid var(--accent);

            animation:
                blink 1s step-end infinite;

        }

        @keyframes blink {

            50% {
                border-color: transparent;
            }

        }

        /* MOBILE */

        @media (max-width: 700px) {

            #day-box {
                font-size: 42px;
                letter-spacing: 6px;
            }

            #date-box {
                font-size: 13px;
                letter-spacing: 2px;
            }

            .type-wrap {
                font-size: 13px;
            }

            .home-search input {
                font-size: 16px;
            }

        }

    </style>

        function updateTime() {

            const now = new Date();

            const days = [
                "Sunday",
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday"
            ];

            document.getElementById("day-box").textContent =
                days[now.getDay()];

            document.getElementById("date-box").textContent =
                now.toLocaleDateString(
                    'en-GB',
                    {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    }
                ).toUpperCase();

        }

        updateTime();

        setInterval(updateTime, 1000);

        /* TYPEWRITER */

            "blazewingz, by blazewingz, for blazewingz."

        ];

        let lIdx = 0;
        let cIdx = 0;
        let isDel = false;

        function type() {

            const cur = lines[lIdx];

            document.getElementById("text").textContent =
                cur.substring(0, cIdx);

            if (!isDel && cIdx < cur.length) {

                cIdx++;

                setTimeout(type, 100);

            }

            else if (isDel && cIdx > 0) {

                cIdx--;

                setTimeout(type, 50);

            }

            else {

                isDel = !isDel;

                if (!isDel) {
                    lIdx = (lIdx + 1) % lines.length;
                }

                setTimeout(type, isDel ? 2000 : 500);

            }

        /* ====================================== */
        /* SEARCH SYSTEM                          */
        /* ====================================== */

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(gameCards, "text/html");

        const gameElements =
            [...doc.querySelectorAll(".bw-card")];

        const games =
            gameElements.map(card => ({

                title:
                    card.querySelector(".bw-name")
                    ?.textContent
                    ?.trim(),

                image:
                    card.querySelector("img")
                    ?.src,

                url:
                    card.href

            }));

        const input =
            document.getElementById("search-input");

        const results =
            document.getElementById("search-results");

        input.addEventListener("input", () => {

            const value =
                input.value.toLowerCase().trim();

            if (!value) {

                results.style.display = "none";

                results.innerHTML = "";

                return;

            }

            const matches =
                games.filter(game =>
                    game.title
                    .toLowerCase()
                    .includes(value)
                );

            results.innerHTML = "";

            if (matches.length === 0) {

                results.style.display = "none";

                return;

            }

            results.style.display = "flex";

            matches.slice(0,5).forEach(game => {

                const a =
                    document.createElement("a");

                a.className = "search-item";

                a.href = game.url;

                a.target = "_blank";

                a.innerHTML = `

                    <img src="${game.image}">

                    <div class="search-info">

                        <div class="search-title">
                            ${game.title}
                        </div>

                        <div class="search-sub">
                            Launch Game
                        </div>

                    </div>

                `;

                results.appendChild(a);

            });

        });

        /* ENTER = FIRST RESULT */

        input.addEventListener("keydown", e => {

            if (e.key === "Enter") {

                const first =
                    results.querySelector(".search-item");

                if (first) {

                    window.open(
                        first.href,
                        "_blank"
                    );

                }

            }

        });
