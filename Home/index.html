<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlazeWingz | Proxy Gateway</title>
    <style>
        body {
            background-color: #0b0214;
            color: #d400ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #d400ff;
            border-radius: 15px;
            background: rgba(20, 5, 30, 0.9);
            box-shadow: 0 0 20px #d400ff, inset 0 0 10px #5a006b;
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px #ff00ff;
        }
        input {
            width: 80%;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            background: #000;
            color: #00ff00; /* Neon green text for that 'hacker' feel */
            outline: none;
            box-shadow: 0 0 5px #ff00ff;
        }
        .btn-group {
            margin-top: 25px;
        }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background: #d400ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s ease;
        }
        button:hover {
            background: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BlazeWingz</h1>
    <p>Enter a URL to bypass filters</p>
    
    <input type="text" id="url-input" placeholder="https://example.com" onkeydown="if(event.key==='Enter') launch()">
    
    <div class="btn-group">
        <button onclick="launch()">Launch Proxy</button>
    </div>
    
    <div class="footer">
        Powered by BlazeWingz GitHub Backend
    </div>
</div>

<script>
    function launch() {
        let url = document.getElementById('url-input').value;
        if (!url) return;

        // Ensure URL starts with http
        if (!url.startsWith('http')) {
            url = 'https://' + url;
        }

        /* Since GitHub is static, we use a public proxy engine.
           You can change 'croxyproxy.com' to any other service if this one gets blocked.
        */
        const proxyUrl = "https://www.croxyproxy.com/_en/proxify.php?u=" + encodeURIComponent(url);
        
        // Opens the proxied site in a new tab
        window.open(proxyUrl, '_blank');
    }
</script>

</body>
</html>
